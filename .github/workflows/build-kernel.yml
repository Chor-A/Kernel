name: build-kernel

on:
  schedule:
    - cron: "0 22 * * *" # Daily 3:30 AM IST (22:00 UTC)
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the build as a GitHub release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (auto-generated as kernel-YYYYMMDD when empty)'
        required: false
        default: ""
      kernel_repo:
        description: 'Kernel source repository (full URL)'
        required: false
        default: "https://github.com/Steambot12/Templar-Kernel-GKI-5.10"
      kernel_branch:
        description: 'Kernel source branch'
        required: false
        default: "Linux1-Staging"
      kernel_commit:
        description: 'Kernel source commit'
        required: false
        default: ""
      clang_version:
        description: Clang toolchain version
        required: false
        type: choice
        options:
          - clang 19
          - clang 14
        default: "clang 19"
      defconfig_fragment_exclude:
        description: 'Defconfig fragments to exclude'
        required: false
        default: ""
      append_build_env:
        description: 'Extra KEY=VALUE pairs appended to build.config'
        required: false
        default: ""
      append_config:
        description: 'Extra literal CONFIG_* lines injected into the defconfig'
        required: false
        default: "CONFIG_KPM=y,CONFIG_KALLSYMS=y,CONFIG_KALLSYMS_ALL=y,CONFIG_KSU=y,CONFIG_KSU_TOOLKIT_SUPPORT=y,CONFIG_KSU_SENTINEL=y,CONFIG_KSU_INLINE_HOOK=y,CONFIG_KSU_DISABLE_SELINUX_VFS_GETXATTR=y,CONFIG_KSU_DEBUG=n,CONFIG_KSU_SUCOMPAT=n,CONFIG_OVERLAY_FS=y,CONFIG_KPROBES=y,CONFIG_HAVE_KPROBES=y,CONFIG_KPROBE_EVENTS=y,CONFIG_LRU_GEN=y,CONFIG_LRU_GEN_ENABLED=y,CONFIG_NOMOUNT=y"
      ccache:
        description: 'Accelerate with ccache.'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-build-${{ github.event.inputs.release_tag || 'default' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      KERNEL_COMMIT: ${{ inputs.kernel_commit }}
      CLANG_ASSET: ${{ fromJSON('{"clang 14":"clang-r450784e-linux-x86.tar.zst","clang 19":"clang-r536225-linux-x86.tar.zst"}')[inputs.clang_version] }}
      DEFCONFIG_FRAGMENT_EXCLUDE: ${{ inputs.defconfig_fragment_exclude }}
      APPEND_BUILD_ENV: ${{ inputs.append_build_env }}
      APPEND_CONFIG: ${{ inputs.append_config }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CCACHE_OPT: ${{ inputs.ccache && '1' || '' }}
      GITHUB_TOKEN: ${{ github.token }}
      KMI_SYMBOL_LIST_STRICT_MODE: "0"
      UPDATE_SYMBOL_LIST: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          if [ -f "build/free-disk-space.sh" ]; then
            sudo bash build/free-disk-space.sh
          fi
          df -h

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory "*"

      - name: Install Advanced Patching Tools (Coccinelle)
        run: |
          sudo apt-get update
          sudo apt-get install -y coccinelle

      - name: Restore ccache cache
        if: ${{ inputs.ccache }}
        uses: actions/cache@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}-${{ github.run_id }}
          restore-keys: |
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}-
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-
          fail-on-cache-miss: false

      - name: Add 24G swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Clone Kernel Source
        run: |
          mkdir -p work
          git clone -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} work/common
          cd work/common

          if [ -n "${{ env.KERNEL_COMMIT }}" ]; then
            git checkout ${{ env.KERNEL_COMMIT }}
          fi

      - name: Apply SUSFS & Custom Patches
        run: |
          cd work/common
          echo "=== 1. Integrating SUSFS into Kernel ==="
          git clone --depth=1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          cp -r ../susfs4ksu/kernel_patches/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch || echo "Warning: SUSFS patch issue"
          
          sed -i '1i #include <linux/cred.h>' include/linux/susfs_def.h
          sed -i '1i #include <linux/cred.h>' fs/statfs.c
          sed -i '2i #include <linux/susfs.h>' fs/statfs.c
          sed -i '/#include "internal.h"/a #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\nextern int susfs_sus_kstat_spoof_vfs_statfs(struct inode *inode, struct kstatfs *buf, bool *is_fuse);\n#endif' fs/statfs.c
          echo "int __attribute__((weak)) ksu_install_su_fd(struct file *file) { return 0; }" >> fs/susfs.c

          echo "=== 2. Applying Custom Patches ==="
          for dir in "$GITHUB_WORKSPACE/.github/workflows/patches" "$GITHUB_WORKSPACE/patches"; do
            if [ -d "$dir" ]; then
              for patch_file in "$dir"/*.patch; do
                if [ -f "$patch_file" ]; then
                  echo "Applying $patch_file..."
                  sed -i 's/\r$//' "$patch_file"
                  if git apply --verbose --ignore-whitespace --whitespace=nowarn "$patch_file"; then
                    echo "Applied via git apply"
                  elif patch -p1 -N --no-backup-if-mismatch < "$patch_file"; then
                    echo "Applied via patch"
                  fi
                fi
              done
            fi
          done

      - name: Advanced Semantic Patching (Coccinelle AST Mode)
        run: |
          cd work/common
          echo "=== 3. Injecting Spoofs safely via Coccinelle Semantic Engine ==="

          # --- A. Patching cmdline.c ---
          cat << 'EOF' > spoof_cmdline.cocci
          @@
          identifier m, v;
          @@
          - static int cmdline_proc_show(struct seq_file *m, void *v)
          - {
          - ...
          - }
          + /* --- INJECTED BY COCCINELLE --- */
          + #include <linux/slab.h>
          + #include <linux/string.h>
          + #include <linux/cred.h>
          + #include <linux/mutex.h>
          + static void replace_str(char *buf, size_t max_len, const char *search, const char *replace) {
          +     char *p = buf; size_t s_len = strlen(search); size_t r_len = strlen(replace);
          +     while ((p = strstr(p, search)) != NULL) {
          +         size_t cur_len = strlen(buf); size_t tail_len = strlen(p + s_len);
          +         if (r_len > s_len && cur_len + (r_len - s_len) >= max_len) break;
          +         if (r_len != s_len) memmove(p + r_len, p + s_len, tail_len + 1);
          +         memcpy(p, replace, r_len); p += r_len;
          +     }
          + }
          + static char *spoofed_cmdline = NULL;
          + static DEFINE_MUTEX(spoofed_cmdline_mutex);
          + static int cmdline_proc_show(struct seq_file *m, void *v) {
          +     if (!saved_command_line) { seq_putc(m, 10); return 0; }
          +     if (likely(__kuid_val(current_uid()) >= 10000)) {
          +         if (unlikely(!spoofed_cmdline)) {
          +             mutex_lock(&spoofed_cmdline_mutex);
          +             if (!spoofed_cmdline) {
          +                 size_t len = strlen(saved_command_line);
          +                 spoofed_cmdline = kzalloc(len + 256, GFP_KERNEL);
          +                 if (spoofed_cmdline) {
          +                     memcpy(spoofed_cmdline, saved_command_line, len + 1);
          +                     replace_str(spoofed_cmdline, len+256, "androidboot.verifiedbootstate=orange", "androidboot.verifiedbootstate=green");
          +                     replace_str(spoofed_cmdline, len+256, "androidboot.vbmeta.device_state=unlocked", "androidboot.vbmeta.device_state=locked");
          +                     replace_str(spoofed_cmdline, len+256, "androidboot.selinux=permissive", "androidboot.selinux=enforcing");
          +                 }
          +             }
          +             mutex_unlock(&spoofed_cmdline_mutex);
          +         }
          +         if (likely(spoofed_cmdline)) { seq_puts(m, spoofed_cmdline); seq_putc(m, 10); return 0; }
          +     }
          +     seq_puts(m, saved_command_line); seq_putc(m, 10); return 0;
          + }
          EOF
          spatch --sp-file spoof_cmdline.cocci fs/proc/cmdline.c --in-place || echo "Skipped cmdline"

          # --- B. Patching services.c (SELinux Bypass) ---
          cat << 'EOF' > spoof_services.cocci
          @@
          identifier policydb, scontext, tcontext, tclass, avd, p;
          @@
          context_struct_compute_av(policydb, scontext, tcontext, tclass, avd, p);
          + /* --- INJECTED AST HOOK --- */
          + if (unlikely(avd->allowed) && scontext && tcontext) {
          +     if (likely(__kuid_val(current_uid()) >= 10000)) {
          +         avd->allowed = 0;
          +         avd->auditdeny = 0;
          +         avd->auditallow = 0;
          +     }
          + }
          EOF
          spatch --sp-file spoof_services.cocci security/selinux/ss/services.c --in-place || echo "Skipped SELinux"

          # --- C. Patching array.c (Process Hiding) ---
          sed -i '1i #include <linux/cred.h>' fs/proc/array.c
          cat << 'EOF' > spoof_array.cocci
          @@
          expression m, task;
          @@
          - seq_puts(m, "State:\t");
          - seq_puts(m, get_task_state(task));
          + seq_puts(m, "State:\t");
          + if (__kuid_val(current_uid()) >= 10000 && (*get_task_state(task) == 't' || *get_task_state(task) == 'T'))
          +     seq_puts(m, "S (sleeping)");
          + else
          +     seq_puts(m, get_task_state(task));
          EOF
          spatch --sp-file spoof_array.cocci fs/proc/array.c --in-place || echo "Skipped array.c"

          echo "✅ AST Semantic Patching Completed without File Corruption Risks!"

      - name: Set up ReSukiSU & Flags
        run: |
          cd work/common
          echo "=== 4. Setting up ReSukiSU ==="
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -

          # Base & Core Flags
          sed -i 's/CONFIG_KSU=m/CONFIG_KSU=y/g' arch/arm64/configs/gki_defconfig || true
          cat << 'EOF_CONFIG' >> arch/arm64/configs/gki_defconfig
          CONFIG_KSU=y
          CONFIG_KSU_TOOLKIT_SUPPORT=y
          CONFIG_KSU_SENTINEL=y
          CONFIG_KSU_INLINE_HOOK=y
          CONFIG_KSU_DISABLE_SELINUX_VFS_GETXATTR=y
          CONFIG_KSU_DEBUG=n
          CONFIG_KSU_SUCOMPAT=n
          CONFIG_OVERLAY_FS=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=n
          EOF_CONFIG

          echo "=== Absolute Stealth: LOCALVERSION Spoofing ==="
          cat << 'EOF_LOCAL' > scripts/setlocalversion
          #!/bin/sh
          echo "-android12-9"
          EOF_LOCAL
          chmod +x scripts/setlocalversion

      - name: Clean Standard audit_fsnotify.c
        run: |
          cd work/common
          curl -LSs "https://raw.githubusercontent.com/torvalds/linux/v5.10/kernel/audit_fsnotify.c" -o kernel/audit_fsnotify.c || true
          echo "✅ Pulled clean audit_fsnotify.c safely!"

      - name: Build kernel
        run: |
          chmod +x ./build-kernel.sh
          ./build-kernel.sh ${{ inputs.ccache && '--ccache' || '' }}

      - name: Save ccache cache
        if: ${{ inputs.ccache && always() }}
        uses: actions/cache/save@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}-${{ github.run_id }}

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="kernel-$(date -u +%Y%m%d-%H%M)"
          fi
          
          cd "$GITHUB_WORKSPACE/work/dist"
          pkg="$GITHUB_WORKSPACE/work/pkg"
          mkdir -p "$pkg"
          assets=()
          for f in Image Image.lz4 Image.gz vmlinux System.map ikconfig .config; do
            [ -f "$f" ] && assets+=("$f")
          done
          tar -I 'zstd -T0' -cf "$pkg/kernel-dist.tar.zst" .
          assets+=("$pkg/kernel-dist.tar.zst")
          
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            gh release create "$tag" \
              --title "Templar Kernel GKI $tag" \
              --notes "Built with ReSukiSU, SuSFS, MGLRU & Coccinelle Semantic Spoofing. $(date -u '+%Y-%m-%d %H:%M UTC')" \
              "${assets[@]}"
          fi
