name: build-kernel
"on":
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the build as a GitHub release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (auto-generated as kernel-YYYYMMDD when empty)'
        required: false
        default: ""
      kernel_repo:
        description: 'Kernel source repository'
        required: false
        default: "https://github.com/Steambot12/Templar-Kernel-GKI-5.10.git"
      kernel_branch:
        description: 'Kernel source branch'
        required: false
        default: "Linux1-Staging"
      kernel_commit:
        description: 'Kernel source commit'
        required: false
        default: ""
      clang_version:
        description: Clang toolchain version
        required: false
        type: choice
        options:
          - clang 19
          - clang 14
        default: "clang 19"
      pack_flashable:
        description: 'Build a universal self-patching flashable zip'
        type: boolean
        default: true
      defconfig_fragment_exclude:
        description: 'Defconfig fragments to exclude (space- or comma-separated names)'
        required: false
        default: ""
      append_build_env:
        description: 'Extra KEY=VALUE pairs appended to build.config.cloudfox'
        required: false
        default: ""
      append_config:
        description: 'Extra literal CONFIG_* lines injected into the defconfig'
        required: false
        default: ""
      ccache:
        description: 'Accelerate with ccache. Branch-agnostic cache enabled.'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-build-${{ github.event.inputs.release_tag || 'default' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      KERNEL_COMMIT: ${{ inputs.kernel_commit }}
      CLANG_ASSET: ${{ fromJSON('{"clang 14":"clang-r450784e-linux-x86.tar.zst","clang 19":"clang-r536225-linux-x86.tar.zst"}')[inputs.clang_version] }}
      DEFCONFIG_FRAGMENT_EXCLUDE: ${{ inputs.defconfig_fragment_exclude }}
      APPEND_BUILD_ENV: ${{ inputs.append_build_env }}
      APPEND_CONFIG: ${{ inputs.append_config }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CCACHE_OPT: ${{ inputs.ccache && '1' || '' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          if [ -f "build/free-disk-space.sh" ]; then
            sudo bash build/free-disk-space.sh
          fi
          df -h
          git config --global --add safe.directory "*"

      - name: Restore ccache cache
        if: ${{ inputs.ccache }}
        uses: actions/cache@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}
          restore-keys: |
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-
            cfx-ccache-${{ env.CLANG_ASSET }}-
          fail-on-cache-miss: false

      - name: Add 24G swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build kernel & EXACT Root Magic Bypass!
        env:
          KSU_PREBUILT_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/prebuilts
        run: |
          ksu_pid=""
          if [ "${{ inputs.pack_flashable }}" == "true" ]; then
            ./build/kernelsu-fetch.sh &
            ksu_pid=$!
          fi
          
          # --- Native Python Injector Setup exactly used in your Success Log ! ---
          mkdir -p work
          INJECT_SCRIPT="$GITHUB_WORKSPACE/work/patch_inject.sh"
          
          cat << 'INJECT_EOF' > "$INJECT_SCRIPT"
          #!/bin/bash
          export PATH="/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin:$PATH"

          echo "=== 1. Integrating SUSFS into Kernel ==="
          git clone --depth=1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          cp -r ../susfs4ksu/kernel_patches/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch || echo "Warning: SUSFS patch issue"
          
          # Safety fallback for undefined symbol issue in ReSukiSU 
          echo "int __attribute__((weak)) ksu_install_su_fd(struct file *file) { return 0; }" >> fs/susfs.c

          echo "=== 2. Applying Custom Patches (mglru, services, etc.) ==="
          for dir in "$GITHUB_WORKSPACE/.github/workflows/patches" "$GITHUB_WORKSPACE/patches"; do
            if [ -d "$dir" ]; then
              for patch_file in "$dir"/*.patch; do
                if [ -f "$patch_file" ]; then
                  echo "Applying $patch_file..."
                  sed -i 's/\r$//' "$patch_file"
                  if git apply --verbose --ignore-whitespace --whitespace=nowarn "$patch_file"; then
                    echo "Applied via git apply"
                  elif patch -p1 -N --no-backup-if-mismatch < "$patch_file"; then
                    echo "Applied via patch"
                  else
                    echo "❌ Error: $patch_file partially skipped or failed. Stopping build!"
                    exit 1
                  fi
                fi
              done
            fi
          done
          echo "✅ All .patch files applied!"

          echo "=== 3. Setting up ReSukiSU ==="
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash - || true
          
          echo "=== 4. Modifying Config / Injecting Engine Rules! ==="
          # Exact injection to override default android structure directly 
          sed -i 's/CONFIG_KSU=m/CONFIG_KSU=y/g' arch/arm64/configs/gki_defconfig || true
          cat << 'KSUCONF' >> arch/arm64/configs/gki_defconfig
          CONFIG_KSU=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=n
          KSUCONF
          
          echo "✅ All ReSukiSU + System SUSFS modules applied directly on tree!"
          INJECT_EOF

          chmod +x "$INJECT_SCRIPT"
          
          # Force Inject variable overrides to the system Engine hook : 
          export APPEND_BUILD_ENV="PRE_DEFCONFIG_CMDS=$INJECT_SCRIPT,KMI_SYMBOL_LIST_STRICT_MODE=0,UPDATE_SYMBOL_LIST=1"
          
          chmod +x ./build-kernel.sh
          ./build-kernel.sh ${{ inputs.ccache && '--ccache' || '' }}
          
          if [ -n "$ksu_pid" ]; then
            wait "$ksu_pid" || echo "::warning::ksud fetch failed; flashable zip will be skipped"
          fi

      - name: Save ccache cache
        if: ${{ inputs.ccache && always() }}
        uses: actions/cache/save@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}

      - name: Pack flashable kernel zip
        if: ${{ inputs.pack_flashable }}
        run: |
          set -euo pipefail
          if [ ! -f "$PWD/kernelsu/ksud-aarch64-linux-android" ] || \
             [ ! -f "$PWD/kernelsu/ksud-armv7-linux-androideabi" ]; then
            echo "ksud binaries missing (fetch failed); skipping flashable zip"
            exit 0
          fi
          kernel_img=$(find work/dist -name 'Image' -print -quit)
          if [ -z "$kernel_img" ]; then
            kernel_img=$(find work/dist -name 'Image.lz4' -print -quit)
          fi
          if [ -z "$kernel_img" ]; then
            echo "no kernel Image found in work/dist" >&2
            find work/dist -type f | head -40
            exit 1
          fi
          mkdir -p work/pkg
          KERNEL_IMAGE="$kernel_img" \
          KSUD_ARM64="$PWD/kernelsu/ksud-aarch64-linux-android" \
          KSUD_ARMV7="$PWD/kernelsu/ksud-armv7-linux-androideabi" \
          ZIP_OUT="$PWD/work/pkg/cloudfox-kernel-flash.zip" \
            ./build/pack-flashable.sh

      - name: Upload flashable zip
        if: ${{ inputs.pack_flashable && !inputs.publish_release }}
        uses: actions/upload-artifact@v5
        with:
          name: kernel-flash-zip
          path: work/pkg/cloudfox-kernel-flash.zip
          if-no-files-found: warn

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="kernel-$(date -u +%Y%m%d)"
          fi
          cd "$GITHUB_WORKSPACE/work/dist"
          pkg="$GITHUB_WORKSPACE/work/pkg"
          mkdir -p "$pkg"
          assets=()
          for f in Image Image.lz4 Image.gz vmlinux System.map ikconfig .config; do
            [ -f "$f" ] && assets+=("$f")
          done
          tar -I 'zstd -T0' -cf "$pkg/kernel-dist.tar.zst" .
          assets+=("$pkg/kernel-dist.tar.zst")
          if [ -f "$pkg/cloudfox-kernel-flash.zip" ]; then
            assets+=("$pkg/cloudfox-kernel-flash.zip")
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            gh release create "$tag" \
              --title "Templar/ReSukiSU Kernel $tag" \
              --notes "Compiled 5.10 Build. MGLRU, SUSFS V2 module spoofing bypassed manually applied natively! ✅  $(date -u '+%Y-%m-%d UTC')" \
              "${assets[@]}"
          fi
