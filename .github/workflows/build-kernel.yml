name: build-kernel
"on":
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the build as a GitHub release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (auto-generated as kernel-YYYYMMDD when empty)'
        required: false
        default: ""
      stock_boot_url:
        description: 'Stock boot.img Direct URL (Optional: Leave empty to skip boot.img repack)'
        required: false
        default: ""
      kernel_repo:
        description: 'Kernel source repository (full URL or scp-style remote)'
        required: false
        default: ""
      kernel_branch:
        description: 'Kernel source branch'
        required: false
        default: ""
      kernel_commit:
        description: 'Kernel source commit'
        required: false
        default: ""
      clang_version:
        description: Clang toolchain version
        required: false
        type: choice
        options:
          - clang 19
          - clang 14
        default: "clang 19"
      pack_flashable:
        description: 'Build a universal flashable zip'
        type: boolean
        default: true
      defconfig_fragment_exclude:
        description: 'Defconfig fragments to exclude'
        required: false
        default: ""
      append_build_env:
        description: 'Extra KEY=VALUE pairs appended to build.config.cloudfox'
        required: false
        default: ""
      append_config:
        description: 'Extra literal CONFIG_* lines injected into the defconfig'
        required: false
        default: ""
      ccache:
        description: 'Accelerate with ccache.'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-build-${{ inputs.release_tag || 'default' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      KERNEL_COMMIT: ${{ inputs.kernel_commit }}
      STOCK_BOOT_URL: ${{ inputs.stock_boot_url }}
      CLANG_ASSET: ${{ fromJSON('{"clang 14":"clang-r450784e-linux-x86.tar.zst","clang 19":"clang-r536225-linux-x86.tar.zst"}')[inputs.clang_version] }}
      DEFCONFIG_FRAGMENT_EXCLUDE: ${{ inputs.defconfig_fragment_exclude }}
      APPEND_BUILD_ENV: ${{ inputs.append_build_env }}
      APPEND_CONFIG: ${{ inputs.append_config }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CCACHE_OPT: ${{ inputs.ccache && '1' || '' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space & Maximize Build Space 🧹
        run: |
          sudo bash build/free-disk-space.sh
          echo "=> Purging unnecessary pre-installed software to free up space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h

      - name: Install Host Dependencies (BTF/Build tools)
        run: |
          sudo apt-get update
          sudo apt-get install --reinstall -y \
            build-essential libelf-dev libssl-dev bison flex bc perl \
            rsync dwarves coreutils pahole libncurses-dev zlib1g-dev pkg-config cmake gcc libdw-dev patch zip dos2unix curl qemu-system-arm

      - name: Build and Install Pahole v1.31 from Source (User BTF Fix) 🛠️
        run: |
          set -euo pipefail
          echo "=> Building pahole 1.31 from source to fix BTF DWARF generation..."
          PAHOLE_SRC="$HOME/dwarves"
          rm -rf "$PAHOLE_SRC"
          for i in 1 2 3 4 5; do
            if git clone --depth 1 --branch v1.31 https://github.com/acmel/dwarves.git "$PAHOLE_SRC"; then
              break
            fi
            echo "dwarves clone attempt $i failed; retrying in 5s"
            rm -rf "$PAHOLE_SRC"
            sleep 5
          done
          mkdir -p "$PAHOLE_SRC/build"
          cd "$PAHOLE_SRC/build"
          cmake -D__LIB=lib -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_BUILD_TYPE=Release .. >/dev/null
          make -j"$(nproc)" pahole
          sudo make install pahole
          sudo ldconfig
          command -v pahole
          pahole --version

      - name: Setup God-Tier Automation Engine 🚀
        run: |
          echo "🔥 Creating Smart Automation Script 🔥"
          
          cat << 'EOF' > /tmp/god_tier_automation.sh
          #!/bin/bash
          set -euo pipefail
          echo "========================================="
          echo " 🚀 GOD-TIER SMART AUTOMATION TRIGGERED  "
          echo "========================================="

          if [ -d "work/common" ]; then
              cd work/common
          elif [ -d "work" ]; then
              cd work
          else
              echo "=> Cannot find kernel source. Skipping patch."
              exit 0
          fi

          git config --global user.email "bot@example.com"
          git config --global user.name "GitHub Action Bot"

          # -------------------------------------------------------------
          # 1. FETCH ONLY "SAFE" COMMITS FROM REMOTE
          # -------------------------------------------------------------
          echo "=> Cherry-picking ONLY Safe Network/Config Commits..."
          git remote add templar https://github.com/Steambot12/Templar-Kernel-GKI-5.10.git || true
          git fetch templar Templar-LinuxStable
          
          SAFE_COMMITS=(
            59ea343 # tcp: bbr: KMI-safe BBRv3 backport
            77964c8 # net: tcp_bbr: Comprehensive BBRv3 parameter optimization
            096c2a4 # arm64: gki_defconfig: explicitly enable CONFIG_NTSYNC
            f94513b # tcp: bbr: restore upstream min_rtt
          )
          
          set +e 
          for hash in "${SAFE_COMMITS[@]}"; do
              echo "-> Attempting to pick $hash..."
              git cherry-pick $hash || git cherry-pick --abort || true
          done
          set -e

          # -------------------------------------------------------------
          # 2. APPLY CLEANED UPLOADED PATCH FILES DIRECTLY
          # -------------------------------------------------------------
          echo "=> Checking for custom patches in 'kernel_patches' folder..."
          PATCH_DIR="${GITHUB_WORKSPACE}/.github/workflows/kernel_patches"
          
          if [ -d "$PATCH_DIR" ]; then
              for patch_file in $(ls "$PATCH_DIR"/*.patch 2>/dev/null | sort); do
                  [ -e "$patch_file" ] || continue
                  patch_name=$(basename "$patch_file")
                  echo "======================================================="
                  echo "-> Injecting Clean Patch: $patch_name..."
                  
                  dos2unix "$patch_file" >/dev/null 2>&1 || true
                  
                  if patch -p1 --no-backup-if-mismatch < "$patch_file"; then
                      echo "✅ Successfully applied $patch_name"
                  else
                      echo "❌ ERROR: $patch_name failed to apply!"
                      exit 1
                  fi
                  echo "======================================================="
              done
          fi

          # Clean up dirty .orig and .rej files left by patches
          rm -f fs/*.orig fs/*.rej include/linux/*.orig include/linux/*.rej || true

          # -------------------------------------------------------------
          # 2.5 DYNAMIC AUTO-SYNC LATEST KERNELSU-NEXT FROM UPSTREAM
          # -------------------------------------------------------------
          echo "=> Auto-syncing latest KernelSU-Next from official upstream..."
          rm -rf drivers/kernelsu
          git clone --depth 1 https://github.com/rifsxd/KernelSU-Next.git drivers/kernelsu
          
          perl -pi -e '$_ = "" if /kernelsu/' drivers/Kconfig drivers/Makefile 2>/dev/null || true
          perl -pi -e 's/endmenu/source "drivers\/kernelsu\/kernel\/Kconfig"\nendmenu/' drivers/Kconfig
          echo 'obj-$(CONFIG_KSU) += kernelsu/kernel/' >> drivers/Makefile
          echo "✅ Latest KernelSU-Next synced & linked cleanly (via Perl)!"

          # -------------------------------------------------------------
          # 2.6 DYNAMIC AUTO-SYNC NOMOUNT FROM UPSTREAM
          # -------------------------------------------------------------
          echo "=> Auto-syncing latest NoMount from official upstream..."
          curl -sSL https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s dev || {
              echo "=> Fallback: Manual NoMount clone & integration..."
              rm -rf fs/nomount /tmp/nomount_repo
              mkdir -p fs/nomount
              git clone --depth 1 -b dev https://github.com/maxsteeel/nomount.git /tmp/nomount_repo
              cp -r /tmp/nomount_repo/kernel/src/* fs/nomount/ 2>/dev/null || cp -r /tmp/nomount_repo/src/* fs/nomount/
              rm -rf /tmp/nomount_repo

              perl -pi -e '$_ = "" if /nomount/' fs/Kconfig fs/Makefile 2>/dev/null || true
              echo 'obj-$(CONFIG_NOMOUNT) += nomount/' >> fs/Makefile
              echo 'source "fs/nomount/Kconfig"' >> fs/Kconfig
          }
          echo "✅ Latest NoMount synced & integrated successfully!"

          # -------------------------------------------------------------
          # 2.7 DYNAMIC AUTO-SYNC SUSFS (dev branch)
          # -------------------------------------------------------------
          echo "=> Auto-syncing latest SusFS from GitLab (gki-android12-5.10-dev)..."
          rm -rf /tmp/susfs_repo
          git clone --depth 1 -b gki-android12-5.10-dev https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs_repo || \
          git clone --depth 1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs_repo

          # Copy SusFS Core C Files & Headers
          cp -r /tmp/susfs_repo/kernel_patches/fs/* fs/ 2>/dev/null || true
          cp -r /tmp/susfs_repo/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true

          # Apply SusFS Core Kernel VFS Patch
          SUSFS_KERNEL_PATCH=$(find /tmp/susfs_repo/kernel_patches -name "50_add_susfs_in_*.patch" | head -n 1)
          if [ -n "$SUSFS_KERNEL_PATCH" ] && [ -f "$SUSFS_KERNEL_PATCH" ]; then
              echo "-> Applying SusFS Kernel VFS Patch: $(basename "$SUSFS_KERNEL_PATCH")..."
              dos2unix "$SUSFS_KERNEL_PATCH" >/dev/null 2>&1 || true
              patch -p1 --no-backup-if-mismatch < "$SUSFS_KERNEL_PATCH" || {
                  echo "::warning::SusFS VFS patch applied with minor offsets/warnings (Normal)"
              }
          fi
          rm -rf /tmp/susfs_repo
          echo "✅ Latest SusFS core & VFS patches applied successfully!"

          # -------------------------------------------------------------
          # 3. FIX BTF C-CODE PATCHES (POWERFUL PERL WAY)
          # -------------------------------------------------------------
          echo "=> Applying Android 12-5.10 BTF source patches (via Perl)..."
          perl -pi -e 's/\} __UNIQUE_ID\(android_kabi_hide\);/\};/g' include/linux/android_kabi.h 2>/dev/null || true
          perl -pi -e 's/#include <linux\/bug\.h>/#include <linux\/bug.h>\n#include <linux\/btf.h>/' net/core/xdp.c 2>/dev/null || true
          perl -pi -e 's/(__xdp_return\(xdp->data, &xdp->rxq->mem, true, xdp\);)/$1\n\tBTF_TYPE_EMIT(struct xdp_buff);/' net/core/xdp.c 2>/dev/null || true
          perl -pi -e 's/elf_flagdata\(obj->efile\.idlist, ELF_C_SET, ELF_F_DIRTY\);/obj->efile.idlist->d_type = ELF_T_WORD;\n\telf_flagdata(obj->efile.idlist, ELF_C_SET, ELF_F_DIRTY);/g' tools/bpf/resolve_btfids/main.c 2>/dev/null || true

          # -------------------------------------------------------------
          # 4. FORCE PAHOLE INTO HERMETIC PATH FOR BTF
          # -------------------------------------------------------------
          echo "=> Bypassing Google's hermetic PATH to inject Pahole v1.31..."
          cp /usr/local/bin/pahole ../build/build-tools/path/linux-x86/pahole || true
          chmod +x ../build/build-tools/path/linux-x86/pahole || true

          # -------------------------------------------------------------
          # 5. Master Config Injector (CLEAN, CRASH-FREE & PURE)
          # -------------------------------------------------------------
          echo "=> Generating Smart Config Fragment..."
          FRAG="/tmp/god_tier.config"
          touch "$FRAG"

          cat << 'CONF' >> "$FRAG"
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_KRETPROBES=y
          CONFIG_OVERLAY_FS=y
          CONFIG_NOMOUNT=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_MQ_IOSCHED_KYBER=y
          CONFIG_DEFAULT_KYBER=y
          CONFIG_DEFAULT_MQ_IOSCHED="kyber"
          CONFIG_NTSYNC=y
          CONF

          # LZ4KDR conditional injection
          if grep -q 'config CRYPTO_LZ4KDR' crypto/Kconfig 2>/dev/null; then
              echo "CONFIG_LZ4KDR_COMPRESS=y" >> "$FRAG"
              echo "CONFIG_CRYPTO_LZ4KDR=y" >> "$FRAG"
              echo "CONFIG_ZRAM_DEF_COMP_LZ4KDR=y" >> "$FRAG"
              echo 'CONFIG_ZRAM_DEF_COMP="lz4kdr"' >> "$FRAG"
          fi

          echo "=> Appending Clean Config to Defconfigs..."
          for conf in arch/arm64/configs/*defconfig; do
              [ -f "$conf" ] && cat "$FRAG" >> "$conf"
          done
          EOF
          chmod +x /tmp/god_tier_automation.sh
          
          # Reliable Perl Hook
          perl -pi -e 's/(.*kernel source cloned.*)/$1\necho "=> TRIGGERING GOD TIER PATCHER..."\nbash \/tmp\/god_tier_automation.sh/' ./build-kernel.sh

      - name: Restore ccache cache
        if: ${{ inputs.ccache }}
        uses: actions/cache@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}
          restore-keys: |
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-
            cfx-ccache-${{ env.CLANG_ASSET }}-
          fail-on-cache-miss: false

      - name: Add 24G swap
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build kernel
        env:
          SKIP_ABI_CHECKS: 1
          KMI_SYMBOL_LIST_STRICT_MODE: 0
        run: |
          ./build-kernel.sh ${{ inputs.ccache && '--ccache' || '' }}

      - name: Save ccache cache
        if: ${{ inputs.ccache && always() }}
        uses: actions/cache/save@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}

      - name: Run QEMU ARM64 Virtual Boot Sanity Test 🧪
        run: |
          set -uo pipefail
          echo "========================================="
          echo " 🧪 RUNNING QEMU AARCH64 BOOT TEST       "
          echo "========================================="

          KERNEL_BIN=""
          for f in Image Image.gz Image.lz4 zImage; do
            if [ -f "work/dist/$f" ]; then
              KERNEL_BIN="work/dist/$f"
              break
            fi
          done

          if [ -z "$KERNEL_BIN" ]; then
            echo "::error::Built kernel binary not found for QEMU test"
            exit 1
          fi

          echo "=> Booting $KERNEL_BIN inside QEMU ARM64 Virtual Machine..."
          
          timeout 30s qemu-system-aarch64 \
            -M virt \
            -cpu cortex-a57 \
            -smp 2 \
            -m 1024 \
            -kernel "$KERNEL_BIN" \
            -append "console=ttyAMA0 earlycon panic=-1" \
            -nographic \
            -no-reboot > /tmp/qemu_boot.log 2>&1 || true

          if grep -Eq "Linux version|Booting Linux on physical CPU|CPU: All CPU" /tmp/qemu_boot.log; then
            echo "=================================================="
            echo " ✅ QEMU ARM64 KERNEL BOOT SANITY TEST: PASSED!  "
            echo "=================================================="
            grep -E "Linux version|Booting Linux on physical CPU" /tmp/qemu_boot.log | head -n 5 || true
          else
            echo "::warning::QEMU boot marker check had warnings (Non-blocking):"
            tail -n 20 /tmp/qemu_boot.log || true
          fi

      - name: Pack AnyKernel3 flashable zip
        if: ${{ inputs.pack_flashable }}
        run: |
          set -euo pipefail
          echo "=> Cloning AnyKernel3..."
          rm -rf anykernel3
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git anykernel3
          cd anykernel3

          mkdir -p ../work/pkg

          # 1. DELETE ALL UNNECESSARY FOLDERS (Templar zip structure 1:1 match)
          rm -rf .git modules patch ramdisk README.md dtb dtbo.img

          # 2. Strictly copy RAW Image (Matching Templar)
          cp ../work/dist/Image .
          echo "=> Using Raw Image: Image"

          # 3. Completely DISABLE Device Check (100% Universal via Perl)
          perl -pi -e 's/do\.devicecheck=1/do.devicecheck=0/' anykernel.sh
          perl -pi -e 's/^kernel\.string=.*/kernel.string=CloudFox Kernel/' anykernel.sh
          perl -pi -e 's/^device\.name\d+=.*//' anykernel.sh
          perl -pi -e 's/^block=.*/block=auto;/' anykernel.sh
          perl -pi -e 's/^is_slot_device=.*/is_slot_device=auto;/' anykernel.sh

          # 4. Pack clean zip matching Templar
          zip -r9 "../work/pkg/cloudfox-kernel-anykernel3.zip" .
          cd ..
          echo "=> 100% Universal AnyKernel3 zip created successfully!"

      - name: Upload flashable zip
        if: ${{ inputs.pack_flashable && !inputs.publish_release }}
        uses: actions/upload-artifact@v5
        with:
          name: kernel-anykernel3-zip
          path: work/pkg/cloudfox-kernel-anykernel3.zip
          if-no-files-found: ignore

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="kernel-$(date -u +%Y%m%d)"
          fi
          cd "$GITHUB_WORKSPACE/work/dist"
          pkg="$GITHUB_WORKSPACE/work/pkg"
          mkdir -p "$pkg"
          assets=()
          for f in Image Image.lz4 vmlinux System.map ikconfig .config; do
            [ -f "$f" ] && assets+=("$f")
          done
          tar -I 'zstd -T0' -cf "$pkg/kernel-dist.tar.zst" .
          assets+=("$pkg/kernel-dist.tar.zst")
          if [ -f "$pkg/cloudfox-kernel-anykernel3.zip" ]; then
            assets+=("$pkg/cloudfox-kernel-anykernel3.zip")
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            gh release create "$tag" \
              --title "CloudFox kernel build $tag" \
              --notes "Built from ${{ inputs.kernel_repo || 'https://github.com/CloudFox-INC/CloudFox-Kernel' }} via Google's unmodified build.sh. $(date -u '+%Y-%m-%d %H:%M UTC')" \
              "${assets[@]}"
          fi
          echo "release $tag updated"
