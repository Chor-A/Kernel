name: build-kernel
"on":
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the build as a GitHub release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (auto-generated as kernel-YYYYMMDD when empty)'
        required: false
        default: ""
      kernel_repo:
        description: 'Kernel source repository (full URL or scp-style remote)'
        required: false
        default: ""
      kernel_branch:
        description: 'Kernel source branch'
        required: false
        default: ""
      kernel_commit:
        description: 'Kernel source commit'
        required: false
        default: ""
      clang_version:
        description: Clang toolchain version
        required: false
        type: choice
        options:
          - clang 19
          - clang 14
        default: "clang 19"
      pack_flashable:
        description: 'Build a universal self-patching flashable zip (on-device kernel replacement via ksud)'
        type: boolean
        default: true
      defconfig_fragment_exclude:
        description: 'Defconfig fragments to exclude (space- or comma-separated names)'
        required: false
        default: ""
      append_build_env:
        description: 'Extra KEY=VALUE pairs appended to build.config.cloudfox'
        required: false
        default: ""
      append_config:
        description: 'Extra literal CONFIG_* lines injected into the defconfig'
        required: false
        default: ""
      ccache:
        description: 'Accelerate with ccache.'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-build-${{ github.event.inputs.release_tag || 'default' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      KERNEL_COMMIT: ${{ inputs.kernel_commit }}
      CLANG_ASSET: ${{ fromJSON('{"clang 14":"clang-r450784e-linux-x86.tar.zst","clang 19":"clang-r536225-linux-x86.tar.zst"}')[inputs.clang_version] }}
      DEFCONFIG_FRAGMENT_EXCLUDE: ${{ inputs.defconfig_fragment_exclude }}
      APPEND_BUILD_ENV: ${{ inputs.append_build_env }}
      APPEND_CONFIG: ${{ inputs.append_config }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CCACHE_OPT: ${{ inputs.ccache && '1' || '' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo bash build/free-disk-space.sh
          df -h

      - name: Setup God-Tier Automation Engine 🚀
        run: |
          echo "🔥 Creating Smart Automation Script 🔥"
          
          cat << 'EOF' > /tmp/god_tier_automation.sh
          #!/bin/bash
          set -euo pipefail
          echo "========================================="
          echo " 🚀 GOD-TIER SMART AUTOMATION TRIGGERED  "
          echo "========================================="

          if [ -d "work/common" ]; then
              cd work/common
          elif [ -d "work" ]; then
              cd work
          else
              echo "=> Cannot find kernel source. Skipping patch."
              exit 0
          fi

          echo "=> Scanning for old KSU..."
          rm -rf fs/kernelsu drivers/kernelsu KernelSU || true
          echo "=> Injecting KernelSU-Next..."
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash - || true

          echo "=> Attempting Dynamic Patch Pulls..."
          if ! grep -q 'config TCP_CONG_BBR3' net/ipv4/Kconfig 2>/dev/null; then
              echo "=> Fetching BBRv3 patches..."
              wget -qO bbr3.patch "https://raw.githubusercontent.com/google/bbr/v3/net/ipv4/tcp_bbr.c" || true
          fi
          
          if [ ! -d "fs/susfs" ]; then
              echo "=> Fetching SUSFS components..."
              git clone https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs || true
              cp -r /tmp/susfs/kernel_patches/fs/* fs/ 2>/dev/null || true
              cp -r /tmp/susfs/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true
          fi

          echo "=> Generating Smart Config Fragment..."
          FRAG="/tmp/god_tier.config"
          touch $FRAG

          function inject() {
              local check="$1"
              local flags="$2"
              if [ -z "$check" ] || eval "$check"; then
                  echo -e "$flags" >> "$FRAG"
              fi
          }

          inject "" "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y\nCONFIG_OPTIMIZE_INLINING=y\nCONFIG_BLOCK=y\nCONFIG_DEBUG_FS=y\nCONFIG_DEVTMPFS=y"
          inject "" "CONFIG_SYSVIPC=y\nCONFIG_POSIX_MQUEUE=y\nCONFIG_IPC_NS=y\nCONFIG_PID_NS=y\nCONFIG_USER_NS=y"
          inject "" "CONFIG_PSI=y\nCONFIG_HZ_1000=y\nCONFIG_JUMP_LABEL=y\nCONFIG_TRANSPARENT_HUGEPAGE_MADVISE=y"
          inject "" "CONFIG_BPF=y\nCONFIG_BPF_JIT=y\nCONFIG_BPF_JIT_ALWAYS_ON=y\nCONFIG_BPF_SYSCALL=y\nCONFIG_CGROUP_BPF=y\nCONFIG_CONFIGFS_FS=y\nCONFIG_CROSS_MEMORY_ATTACH=y\nCONFIG_CRYPTO=y\nCONFIG_DEBUG_INFO_BTF=y\nCONFIG_EXT4_FS=y"
          inject "" "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y\nCONFIG_NETFILTER_XT_TARGET_REJECT=y\nCONFIG_NETFILTER_XT_TARGET_LOG=y\nCONFIG_NETFILTER_XT_MATCH_RECENT=y\nCONFIG_IP_SET=y\nCONFIG_IP_SET_HASH_IP=y\nCONFIG_IP_SET_HASH_NET=y\nCONFIG_NETFILTER_XT_SET=y"
          inject "" "CONFIG_NET_SCH_FQ=y\nCONFIG_DEFAULT_FQ=y\nCONFIG_DEFAULT_NET_SCH=\"fq\""
          inject "" "CONFIG_WORKINGSET_PROTECTION=y\nCONFIG_ZRAM=y\nCONFIG_ZSMALLOC=y\nCONFIG_SYSFS=y\nCONFIG_LZ4KD_COMPRESS=y\nCONFIG_LZ4KD_DECOMPRESS=y\nCONFIG_CRYPTO_LZ4KD=y\nCONFIG_ZRAM_MEMORY_TRACKING=y\nCONFIG_ZRAM_MULTI_COMP=y\nCONFIG_ZRAM_WRITEBACK=y"
          inject "" "CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y\nCONFIG_WQ_POWER_EFFICIENT_DEFAULT=y\nCONFIG_TMPFS=y\nCONFIG_TMPFS_POSIX_ACL=y\nCONFIG_TMPFS_XATTR=y"
          inject "" "CONFIG_OVERLAY_FS=y\nCONFIG_MSDOS_FS=y\nCONFIG_VIRTIO_FS=y\nCONFIG_INCREMENTAL_FS=y\nCONFIG_FUSE_FS=y\nCONFIG_FUSE_BPF=y"
          inject "" "CONFIG_LZ4_DECOMPRESS=y\nCONFIG_LZ4HC_DECOMPRESS=y\nCONFIG_XZ_DEC=y\nCONFIG_XZ_DEC_ARM=y\nCONFIG_XZ_DEC_ARMTHUMB=y\nCONFIG_XZ_DEC_BCJ=y\nCONFIG_ZLIB_INFLATE=y\nCONFIG_CRYPTO_DECOMPRESS=y\nCONFIG_BUFFER_HEAD=y\nCONFIG_FS_ENCRYPTION=y\nCONFIG_FS_VERITY=y"

          inject "grep -q 'config EROFS_FS' fs/erofs/Kconfig 2>/dev/null" "CONFIG_EROFS_FS=y\nCONFIG_EROFS_FS_ZIP=y\nCONFIG_EROFS_FS_CLUSTER_PAGE_LIMIT=1\nCONFIG_EROFS_FS_XATTR=y\nCONFIG_EROFS_FS_POSIX_ACL=y\nCONFIG_EROFS_FS_SECURITY=y\nCONFIG_EROFS_FS_ZIP_LZMA=y\nCONFIG_EROFS_FS_ZIP_DEFLATE=y\nCONFIG_EROFS_FS_ZIP_ACCEL=y\nCONFIG_EROFS_FS_ONDEMAND=y"
          inject "grep -q 'config F2FS_FS' fs/f2fs/Kconfig 2>/dev/null" "CONFIG_F2FS_FS=y\nCONFIG_F2FS_FS_COMPRESSION=y\nCONFIG_F2FS_FS_LZ4=y\nCONFIG_F2FS_FS_LZ4HC=y\nCONFIG_F2FS_FS_LZO=y\nCONFIG_F2FS_FS_LZORLE=y\nCONFIG_F2FS_FS_ZSTD=y"
          inject "test -d mm/damon" "CONFIG_DAMON=y\nCONFIG_DAMON_VADDR=y\nCONFIG_DAMON_PADDR=y\nCONFIG_DAMON_SYSFS=y\nCONFIG_DAMON_RECLAIM=y"
          inject "grep -q 'config LRU_GEN' mm/Kconfig 2>/dev/null" "CONFIG_LRU_GEN=y\nCONFIG_LRU_GEN_ENABLED=y\nCONFIG_LRU_GEN_STATS=y"
          inject "grep -q 'config TCP_CONG_BBR3' net/ipv4/Kconfig 2>/dev/null || test -f net/ipv4/tcp_bbr3.c" "CONFIG_TCP_CONG_BBR3=y\nCONFIG_DEFAULT_BBR3=y\nCONFIG_DEFAULT_TCP_CONG=\"bbr3\""
          inject "grep -q 'config CRYPTO_LZ4KDR' crypto/Kconfig 2>/dev/null" "CONFIG_LZ4KDR_COMPRESS=y\nCONFIG_CRYPTO_LZ4KDR=y\nCONFIG_ZRAM_DEF_COMP_LZ4KDR=y"
          inject "grep -q 'config MQ_IOSCHED_KYBER' block/Kconfig.iosched 2>/dev/null" "CONFIG_MQ_IOSCHED_KYBER=y\nCONFIG_DEFAULT_KYBER=y\nCONFIG_DEFAULT_IOSCHED=\"kyber\""
          inject "grep -q 'config DROIDSPACE' init/Kconfig 2>/dev/null || grep -q 'config DROIDSPACE' security/Kconfig 2>/dev/null" "CONFIG_DROIDSPACE=y"
          inject "test -d fs/kernelsu" "CONFIG_KSU=y\nCONFIG_KPROBES=y\nCONFIG_MODULE_SKIP_BUILTIN=y"
          inject "grep -q 'config BASEBAND_GUARD' security/Kconfig 2>/dev/null" "CONFIG_BASEBAND_GUARD=y"

          echo "=> Appending to Defconfigs..."
          for conf in arch/arm64/configs/*defconfig; do
              [ -f "$conf" ] && cat $FRAG >> "$conf"
          done
          EOF
          chmod +x /tmp/god_tier_automation.sh
          
          sed -i '/kernel source cloned/a \
          echo "=> TRIGGERING GOD TIER PATCHER..." \
          bash /tmp/god_tier_automation.sh' ./build-kernel.sh

      - name: Restore ccache cache
        if: ${{ inputs.ccache }}
        uses: actions/cache@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}
          restore-keys: |
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-
            cfx-ccache-${{ env.CLANG_ASSET }}-
          fail-on-cache-miss: false

      - name: Add 24G swap
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build kernel
        env:
          # 🔥 Reverted to the native repository link! Will work perfectly after running publish-prebuilts.
          KSU_PREBUILT_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/prebuilts
        run: |
          ksu_pid=""
          if [ "${{ inputs.pack_flashable }}" == "true" ]; then
            ./build/kernelsu-fetch.sh &
            ksu_pid=$!
          fi
          ./build-kernel.sh ${{ inputs.ccache && '--ccache' || '' }}
          if [ -n "$ksu_pid" ]; then
            wait "$ksu_pid" || echo "::warning::ksud fetch failed; flashable zip will be skipped"
          fi

      - name: Save ccache cache
        if: ${{ inputs.ccache && always() }}
        uses: actions/cache/save@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}

      - name: Pack flashable kernel zip
        if: ${{ inputs.pack_flashable }}
        run: |
          set -euo pipefail
          if [ ! -f "$PWD/kernelsu/ksud-aarch64-linux-android" ] || \
             [ ! -f "$PWD/kernelsu/ksud-armv7-linux-androideabi" ]; then
            echo "ksud binaries missing (fetch failed); skipping flashable zip"
            exit 0
          fi
          kernel_img=$(find work/dist -name 'Image' -print -quit)
          if [ -z "$kernel_img" ]; then
            kernel_img=$(find work/dist -name 'Image.lz4' -print -quit)
          fi
          if [ -z "$kernel_img" ]; then
            echo "no kernel Image found in work/dist" >&2
            find work/dist -type f | head -40
            exit 1
          fi
          mkdir -p work/pkg
          KERNEL_IMAGE="$kernel_img" \
          KSUD_ARM64="$PWD/kernelsu/ksud-aarch64-linux-android" \
          KSUD_ARMV7="$PWD/kernelsu/ksud-armv7-linux-androideabi" \
          ZIP_OUT="$PWD/work/pkg/cloudfox-kernel-flash.zip" \
            ./build/pack-flashable.sh

      - name: Upload flashable zip
        if: ${{ inputs.pack_flashable && !inputs.publish_release }}
        uses: actions/upload-artifact@v5
        with:
          name: kernel-flash-zip
          path: work/pkg/cloudfox-kernel-flash.zip
          if-no-files-found: warn

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="kernel-$(date -u +%Y%m%d)"
          fi
          cd "$GITHUB_WORKSPACE/work/dist"
          pkg="$GITHUB_WORKSPACE/work/pkg"
          mkdir -p "$pkg"
          assets=()
          for f in Image Image.lz4 vmlinux System.map ikconfig .config; do
            [ -f "$f" ] && assets+=("$f")
          done
          tar -I 'zstd -T0' -cf "$pkg/kernel-dist.tar.zst" .
          assets+=("$pkg/kernel-dist.tar.zst")
          if [ -f "$pkg/cloudfox-kernel-flash.zip" ]; then
            assets+=("$pkg/cloudfox-kernel-flash.zip")
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            gh release create "$tag" \
              --title "CloudFox kernel build $tag" \
              --notes "Built from ${{ inputs.kernel_repo || 'https://github.com/CloudFox-INC/CloudFox-Kernel' }} via Google's unmodified build.sh. $(date -u '+%Y-%m-%d %H:%M UTC')" \
              "${assets[@]}"
          fi
          echo "release $tag updated"
