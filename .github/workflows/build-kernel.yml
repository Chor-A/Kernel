name: build-kernel
"on":
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the build as a GitHub release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (auto-generated as kernel-YYYYMMDD when empty)'
        required: false
        default: ""
      kernel_repo:
        description: 'Kernel source repository (full URL or scp-style remote)'
        required: false
        default: "https://github.com/Steambot12/Templar-Kernel-GKI-5.10.git"
      kernel_branch:
        description: 'Kernel source branch'
        required: false
        default: "Linux1-Staging"
      kernel_commit:
        description: 'Kernel source commit'
        required: false
        default: ""
      clang_version:
        description: Clang toolchain version
        required: false
        type: choice
        options:
          - clang 19
          - clang 14
        default: "clang 19"
      pack_flashable:
        description: 'Build a universal self-patching flashable zip (on-device kernel replacement)'
        type: boolean
        default: true
      defconfig_fragment_exclude:
        description: 'Defconfig fragments to exclude (space- or comma-separated names)'
        required: false
        default: ""
      append_build_env:
        description: 'Extra KEY=VALUE pairs appended to build.config.cloudfox (comma-separated, e.g. "TRIM_UNUSED_KSYMS=1,LOCALVERSION=-vanilla"; sourced by build.sh)'
        required: false
        default: ""
      append_config:
        description: 'Extra literal CONFIG_* lines injected into the defconfig'
        required: false
        default: ""
      ccache:
        description: 'Accelerate with ccache. Branch-agnostic: objects shared across kernel branches/commits are reused from a cross-run cache.'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-build-${{ github.event.inputs.release_tag || 'default' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      KERNEL_COMMIT: ${{ inputs.kernel_commit }}
      CLANG_ASSET: ${{ fromJSON('{"clang 14":"clang-r450784e-linux-x86.tar.zst","clang 19":"clang-r536225-linux-x86.tar.zst"}')[inputs.clang_version] }}
      DEFCONFIG_FRAGMENT_EXCLUDE: ${{ inputs.defconfig_fragment_exclude }}
      APPEND_BUILD_ENV: ${{ inputs.append_build_env }}
      APPEND_CONFIG: ${{ inputs.append_config }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CCACHE_OPT: ${{ inputs.ccache && '1' || '' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo bash build/free-disk-space.sh
          df -h

      - name: Restore ccache cache
        if: ${{ inputs.ccache }}
        uses: actions/cache@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}
          restore-keys: |
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-
            cfx-ccache-${{ env.CLANG_ASSET }}-
          fail-on-cache-miss: false

      - name: Add 24G swap
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build kernel (With Custom Patches & ReSukiSU Injection)
        env:
          KSU_PREBUILT_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/prebuilts
        run: |
          # Fetch packing scripts asynchronously
          ksu_pid=""
          if [ "${{ inputs.pack_flashable }}" == "true" ]; then
            ./build/kernelsu-fetch.sh &
            ksu_pid=$!
          fi
          
          # ================== AUTOMATED KERNEL PATCHING & RESUKISU LOGIC ==================
          # Export workflow's dir securely to run before compile loop.
          export WORKSPACE_DIR="$PWD"
          cat << 'HOOK_EOF' > custom_patch_ksu.sh
          echo "=====[ APPLYING ALL PATCH FILES & RESUKISU INTEGRATION ]====="
          # -> Pull ReSukiSU from official repo
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash - || echo "!! ReSukiSU Fetch Error Occurred !!"
          
          # -> Verify local repo "patches/" folder under github Actions exists and inject ALL matches!
          PATCH_LOC="$WORKSPACE_DIR/.github/workflows/patches"
          if [ -d "$PATCH_LOC" ]; then
            for local_patch in "$PATCH_LOC"/*.patch; do
              if [ -f "$local_patch" ]; then
                echo "=> Modifying tree -> Attempting patching with source file: $(basename "$local_patch")"
                patch -p1 --forward < "$local_patch" || echo "[Warning] Conflicting chunks applying: $(basename "$local_patch")! Code Continues."
              fi
            done
          else
            echo "=> Patches repository directory (.github/workflows/patches) could not be located; Skipping module."
          fi
          echo "=========================================================================="
          HOOK_EOF
          chmod +x custom_patch_ksu.sh
          
          # Inject script execution exactly into cloudfox script runner directly via sed modifications!
          sed -i -e '/build\/build\.sh/i source '"$WORKSPACE_DIR"'/custom_patch_ksu.sh' ./build-kernel.sh
          # Catch other make environments conditionally.
          sed -i -e '/\s\s*make\s\s*O=/i source '"$WORKSPACE_DIR"'/custom_patch_ksu.sh' ./build-kernel.sh
          # ===========================================================================================

          ./build-kernel.sh ${{ inputs.ccache && '--ccache' || '' }}
          
          if [ -n "$ksu_pid" ]; then
            wait "$ksu_pid" || echo "::warning::Flash tool binaries fetch failed; flashable zip will be skipped"
          fi

      - name: Save ccache cache
        if: ${{ inputs.ccache && always() }}
        uses: actions/cache/save@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}

      - name: Pack flashable kernel zip
        if: ${{ inputs.pack_flashable }}
        run: |
          set -euo pipefail
          if [ ! -f "$PWD/kernelsu/ksud-aarch64-linux-android" ] || \
             [ ! -f "$PWD/kernelsu/ksud-armv7-linux-androideabi" ]; then
            echo "tools binaries missing (fetch failed); skipping flashable zip"
            exit 0
          fi
          kernel_img=$(find work/dist -name 'Image' -print -quit)
          if [ -z "$kernel_img" ]; then
            kernel_img=$(find work/dist -name 'Image.lz4' -print -quit)
          fi
          if [ -z "$kernel_img" ]; then
            echo "no kernel Image found in work/dist" >&2
            find work/dist -type f | head -40
            exit 1
          fi
          mkdir -p work/pkg
          KERNEL_IMAGE="$kernel_img" \
          KSUD_ARM64="$PWD/kernelsu/ksud-aarch64-linux-android" \
          KSUD_ARMV7="$PWD/kernelsu/ksud-armv7-linux-androideabi" \
          ZIP_OUT="$PWD/work/pkg/cloudfox-kernel-flash.zip" \
            ./build/pack-flashable.sh

      - name: Upload flashable zip
        if: ${{ inputs.pack_flashable && !inputs.publish_release }}
        uses: actions/upload-artifact@v5
        with:
          name: kernel-flash-zip
          path: work/pkg/cloudfox-kernel-flash.zip
          if-no-files-found: warn

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="kernel-$(date -u +%Y%m%d)"
          fi
          cd "$GITHUB_WORKSPACE/work/dist"
          pkg="$GITHUB_WORKSPACE/work/pkg"
          mkdir -p "$pkg"
          assets=()
          for f in Image Image.lz4 vmlinux System.map ikconfig .config; do
            [ -f "$f" ] && assets+=("$f")
          done
          tar -I 'zstd -T0' -cf "$pkg/kernel-dist.tar.zst" .
          assets+=("$pkg/kernel-dist.tar.zst")
          if [ -f "$pkg/cloudfox-kernel-flash.zip" ]; then
            assets+=("$pkg/cloudfox-kernel-flash.zip")
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            gh release create "$tag" \
              --title "CloudFox ReSukiSU build $tag" \
              --notes "Built from ${{ inputs.kernel_repo || 'https://github.com/CloudFox-INC/CloudFox-Kernel' }} $(date -u '+%Y-%m-%d %H:%M UTC')" \
              "${assets[@]}"
          fi
          echo "release $tag updated"
