name: build-kernel
"on":
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the build as a GitHub release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (auto-generated as kernel-YYYYMMDD when empty)'
        required: false
        default: ""
      kernel_repo:
        description: 'Kernel source repository (full URL or scp-style remote)'
        required: false
        default: ""
      kernel_branch:
        description: 'Kernel source branch'
        required: false
        default: ""
      kernel_commit:
        description: 'Kernel source commit'
        required: false
        default: ""
      clang_version:
        description: Clang toolchain version
        required: false
        type: choice
        options:
          - clang 19
          - clang 14
        default: "clang 19"
      pack_flashable:
        description: 'Build a universal self-patching flashable zip (on-device kernel replacement via ksud)'
        type: boolean
        default: true
      defconfig_fragment_exclude:
        description: 'Defconfig fragments to exclude (space- or comma-separated names)'
        required: false
        default: ""
      append_build_env:
        description: 'Extra KEY=VALUE pairs appended to build.config.cloudfox'
        required: false
        default: ""
      append_config:
        description: 'Extra literal CONFIG_* lines injected into the defconfig'
        required: false
        default: ""
      ccache:
        description: 'Accelerate with ccache.'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-build-${{ github.event.inputs.release_tag || 'default' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      KERNEL_COMMIT: ${{ inputs.kernel_commit }}
      CLANG_ASSET: ${{ fromJSON('{"clang 14":"clang-r450784e-linux-x86.tar.zst","clang 19":"clang-r536225-linux-x86.tar.zst"}')[inputs.clang_version] }}
      DEFCONFIG_FRAGMENT_EXCLUDE: ${{ inputs.defconfig_fragment_exclude }}
      APPEND_BUILD_ENV: ${{ inputs.append_build_env }}
      APPEND_CONFIG: ${{ inputs.append_config }}
      RELEASE_TAG: ${{ inputs.RELEASE_TAG }}
      CCACHE_OPT: ${{ inputs.ccache && '1' || '' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo bash build/free-disk-space.sh
          df -h

      - name: Install Host Dependencies (libelf, dwarves, etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libelf-dev \
            libssl-dev \
            bison \
            flex \
            bc \
            rsync \
            dwarves \
            libncurses-dev \
            zlib1g-dev \
            pkg-config

      - name: Setup Master-Tier Automation & Patch Engine 🚀
        run: |
          echo "🔥 Creating Master Automation Script 🔥"
          
          cat << 'EOF' > /tmp/master_automation.sh
          #!/bin/bash
          set -euo pipefail
          echo "========================================="
          echo " 🚀 MASTER-TIER AUTOMATION TRIGGERED     "
          echo "========================================="

          if [ -d "work/common" ]; then
              cd work/common
          elif [ -d "work" ]; then
              cd work
          else
              echo "=> Cannot find kernel source directory. Skipping patches."
              exit 0
          fi

          # 1. Clean KernelSU-Next Injection into drivers/kernelsu
          echo "=> Purging old KSU remnants..."
          rm -rf fs/kernelsu drivers/kernelsu KernelSU /tmp/KSUN || true
          
          echo "=> Cloning and integrating KernelSU-Next..."
          git clone https://github.com/rifsxd/KernelSU-Next.git /tmp/KSUN
          mkdir -p drivers/kernelsu
          cp -rf /tmp/KSUN/* drivers/kernelsu/
          rm -rf /tmp/KSUN

          # 2. Enable Native Linux 5.10 BBR Congestion Control (Fully Compatible)
          echo "=> Enabling Native BBR Congestion Control..."
          if ! grep -q 'config TCP_CONG_BBR' net/ipv4/Kconfig 2>/dev/null; then
              if ! grep -q "TCP_CONG_BBR" net/ipv4/Kconfig; then
                  echo -e "\nconfig TCP_CONG_BBR\n\ttristate \"BBR congestion control\"\n\tdefault y\n" >> net/ipv4/Kconfig
              fi
          fi

          # 3. SusFS Integration (Targeting 5.10 properly without corrupting files)
          echo "=> Integrating SusFS components safely..."
          if [ ! -d "fs/susfs" ]; then
              git clone https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs || true
              if [ -d "/tmp/susfs/kernel_patches" ]; then
                  if [ -d "/tmp/susfs/kernel_patches/fs/susfs" ]; then
                      cp -r /tmp/susfs/kernel_patches/fs/susfs fs/
                  fi
                  if [ -d "/tmp/susfs/kernel_patches/include/linux" ]; then
                      cp -r /tmp/susfs/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true
                  fi
              fi
              rm -rf /tmp/susfs
          fi

          # 4. Master Config Injector (Your Custom Master Defconfig)
          echo "=> Generating Master Config Fragment..."
          FRAG="/tmp/master_tier.config"
          
          cat << 'CONF' > $FRAG
          CONFIG_MMU=y
          CONFIG_SPARSEMEM=y
          CONFIG_SPARSEMEM_VMEMMAP=y
          CONFIG_SYSFS=y
          CONFIG_DEBUG_FS=y
          CONFIG_DAMON=y
          CONFIG_DAMON_VADDR=y
          CONFIG_DAMON_PADDR=y
          CONFIG_DAMON_SYSFS=y
          CONFIG_CRYPTO=y
          CONFIG_CRYPTO_LZ4=y
          CONFIG_CRYPTO_LZO=y
          CONFIG_CRYPTO_ZSTD=y
          CONFIG_ZSWAP=y
          CONFIG_ZPOOL=y
          CONFIG_ZSMALLOC=y
          CONFIG_BLK_DEV_ZRAM=y
          CONFIG_ZRAM_WRITEBACK=y
          CONFIG_ZRAM_MULTI_COMP=y
          CONFIG_ZRAM_MEMORY_TRACKING=y
          CONFIG_SWAP=y
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_PSI=y
          CONFIG_LRU_GEN=y
          CONFIG_LRU_GEN_ENABLED=y
          CONFIG_SMP=y
          CONFIG_SCHED_MC=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_RT_GROUP_SCHED=y
          CONFIG_CPU_FREQ=y
          CONFIG_CPU_FREQ_STAT=y
          CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
          CONFIG_ENERGY_AWARE=y
          CONFIG_SCHED_CASS=y
          CONFIG_UCLAMP_TASK=y
          CONFIG_UCLAMP_TASK_GROUP=y
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_CGROUP_BPF=y
          CONFIG_DEBUG_INFO_BTF=y
          CONFIG_SECURITY=y
          CONFIG_SECURITY_NETWORK=y
          CONFIG_CRYPTO_SHA256=y
          CONFIG_ASYMMETRIC_KEY_TYPE=y
          CONFIG_SECURITY_SELINUX=y
          CONFIG_SECURITY_APPARMOR=y
          CONFIG_SECURITY_SAFESETID=y
          CONFIG_SECURITY_LOCKDOWN_LSM=y
          CONFIG_BPF_LSM=y
          CONFIG_KPROBES=y
          CONFIG_KRETPROBES=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU=y
          CONFIG_ANON_INODES=y
          CONFIG_EVENTFD=y
          CONFIG_IO_URING=y
          CONFIG_ANDROID_BINDER_IPC=y
          CONFIG_ANDROID_BINDERFS=y
          CONFIG_BLOCK=y
          CONFIG_BLK_INLINE_ENCRYPTION=y
          CONFIG_FS_ENCRYPTION=y
          CONFIG_FS_VERITY=y
          CONFIG_CRYPTO_CRC32=y
          CONFIG_F2FS_FS=y
          CONFIG_F2FS_FS_COMPRESSION=y
          CONFIG_F2FS_FS_ZSTD=y
          CONFIG_EROFS_FS=y
          CONFIG_EROFS_FS_ZIP=y
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_ZSTD_COMPRESS=y
          CONFIG_ZSTD_DECOMPRESS=y
          CONFIG_XZ_DEC_ARM64=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONF

          echo "=> Appending Master Config Fragment to Defconfigs..."
          for conf in arch/arm64/configs/*defconfig; do
              [ -f "$conf" ] && cat $FRAG >> "$conf"
          done
          echo "=> Master Automation & Config Injection Completed Successfully!"
          EOF
          chmod +x /tmp/master_automation.sh
          
          # Reliable Hook Insertion into build-kernel.sh
          sed -i '/kernel source cloned/a \
          echo "=> TRIGGERING MASTER AUTOMATION PATCHER..." \
          bash /tmp/master_automation.sh' ./build-kernel.sh

      - name: Restore ccache cache
        if: ${{ inputs.ccache }}
        uses: actions/cache@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}
          restore-keys: |
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-
            cfx-ccache-${{ env.CLANG_ASSET }}-
          fail-on-cache-miss: false

      - name: Add 8G Optimized Swap (Safe Disk Storage)
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h

      - name: Build kernel
        env:
          KSU_PREBUILT_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/prebuilts
        run: |
          ksu_pid=""
          if [ "${{ inputs.pack_flashable }}" == "true" ]; then
            ./build/kernelsu-fetch.sh &
            ksu_pid=$!
          fi
          ./build-kernel.sh ${{ inputs.ccache && '--ccache' || '' }}
          if [ -n "$ksu_pid" ]; then
            wait "$ksu_pid" || echo "::warning::ksud fetch failed; flashable zip will be skipped"
          fi

      - name: Save ccache cache
        if: ${{ inputs.ccache && always() }}
        uses: actions/cache/save@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}

      - name: Pack flashable kernel zip
        if: ${{ inputs.pack_flashable }}
        run: |
          set -euo pipefail
          if [ ! -f "$PWD/kernelsu/ksud-aarch64-linux-android" ] || \
             [ ! -f "$PWD/kernelsu/ksud-armv7-linux-androideabi" ]; then
            echo "ksud binaries missing (fetch failed); skipping flashable zip"
            exit 0
          fi
          kernel_img=$(find work/dist -name 'Image' -print -quit)
          if [ -z "$kernel_img" ]; then
            kernel_img=$(find work/dist -name 'Image.lz4' -print -quit)
          fi
          if [ -z "$kernel_img" ]; then
            echo "no kernel Image found in work/dist" >&2
            find work/dist -type f | head -40
            exit 1
          fi
          mkdir -p work/pkg
          KERNEL_IMAGE="$kernel_img" \
          KSUD_ARM64="$PWD/kernelsu/ksud-aarch64-linux-android" \
          KSUD_ARMV7="$PWD/kernelsu/ksud-armv7-linux-androideabi" \
          ZIP_OUT="$PWD/work/pkg/cloudfox-kernel-flash.zip" \
            ./build/pack-flashable.sh

      - name: Upload flashable zip
        if: ${{ inputs.pack_flashable && !inputs.publish_release }}
        uses: actions/upload-artifact@v5
        with:
          name: kernel-flash-zip
          path: work/pkg/cloudfox-kernel-flash.zip
          if-no-files-found: warn

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="kernel-$(date -u +%Y%m%d)"
          fi
          cd "$GITHUB_WORKSPACE/work/dist"
          pkg="$GITHUB_WORKSPACE/work/pkg"
          mkdir -p "$pkg"
          assets=()
          for f in Image Image.lz4 vmlinux System.map ikconfig .config; do
            [ -f "$f" ] && assets+=("$f")
          done
          tar -I 'zstd -T0' -cf "$pkg/kernel-dist.tar.zst" .
          assets+=("$pkg/kernel-dist.tar.zst")
          if [ -f "$pkg/cloudfox-kernel-flash.zip" ]; then
            assets+=("$pkg/cloudfox-kernel-flash.zip")
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            gh release create "$tag" \
              --title "CloudFox kernel build $tag" \
              --notes "Built from ${{ inputs.kernel_repo || 'https://github.com/CloudFox-INC/CloudFox-Kernel' }} via Google's unmodified build.sh. $(date -u '+%Y-%m-%d %H:%M UTC')" \
              "${assets[@]}"
          fi
          echo "release $tag updated"
