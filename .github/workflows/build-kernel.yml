name: build-kernel
"on":
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the build as a GitHub release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (auto-generated as kernel-YYYYMMDD when empty)'
        required: false
        default: ""
      stock_boot_url:
        description: 'Stock boot.img Direct URL (Optional: Leave empty to skip boot.img repack)'
        required: false
        default: ""
      kernel_repo:
        description: 'Kernel source repository (full URL or scp-style remote)'
        required: false
        default: ""
      kernel_branch:
        description: 'Kernel source branch'
        required: false
        default: ""
      kernel_commit:
        description: 'Kernel source commit'
        required: false
        default: ""
      clang_version:
        description: Clang toolchain version
        required: false
        type: choice
        options:
          - clang 19
          - clang 14
        default: "clang 19"
      pack_flashable:
        description: 'Build a universal flashable zip'
        type: boolean
        default: true
      defconfig_fragment_exclude:
        description: 'Defconfig fragments to exclude'
        required: false
        default: ""
      append_build_env:
        description: 'Extra KEY=VALUE pairs appended to build.config.cloudfox'
        required: false
        default: ""
      append_config:
        description: 'Extra literal CONFIG_* lines injected into the defconfig'
        required: false
        default: ""
      ccache:
        description: 'Accelerate with ccache.'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-build-${{ inputs.release_tag || 'default' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      KERNEL_COMMIT: ${{ inputs.kernel_commit }}
      STOCK_BOOT_URL: ${{ inputs.stock_boot_url }}
      CLANG_ASSET: ${{ fromJSON('{"clang 14":"clang-r450784e-linux-x86.tar.zst","clang 19":"clang-r536225-linux-x86.tar.zst"}')[inputs.clang_version] }}
      DEFCONFIG_FRAGMENT_EXCLUDE: ${{ inputs.defconfig_fragment_exclude }}
      APPEND_BUILD_ENV: ${{ inputs.append_build_env }}
      APPEND_CONFIG: ${{ inputs.append_config }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CCACHE_OPT: ${{ inputs.ccache && '1' || '' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space & Maximize Build Space 🧹
        run: |
          sudo bash build/free-disk-space.sh
          echo "=> Purging unnecessary pre-installed software to free up space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h

      - name: Install Host Dependencies (BTF/Build tools)
        run: |
          sudo apt-get update
          sudo apt-get install --reinstall -y \
            build-essential libelf-dev libssl-dev bison flex bc \
            rsync dwarves coreutils pahole libncurses-dev zlib1g-dev pkg-config cmake gcc libdw-dev patch zip dos2unix curl qemu-system-arm

      - name: Build and Install Pahole v1.31 from Source (User BTF Fix) 🛠️
        run: |
          set -euo pipefail
          echo "=> Building pahole 1.31 from source to fix BTF DWARF generation..."
          PAHOLE_SRC="$HOME/dwarves"
          rm -rf "$PAHOLE_SRC"
          for i in 1 2 3 4 5; do
            if git clone --depth 1 --branch v1.31 https://github.com/acmel/dwarves.git "$PAHOLE_SRC"; then
              break
            fi
            echo "dwarves clone attempt $i failed; retrying in 5s"
            rm -rf "$PAHOLE_SRC"
            sleep 5
          done
          mkdir -p "$PAHOLE_SRC/build"
          cd "$PAHOLE_SRC/build"
          cmake -D__LIB=lib -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_BUILD_TYPE=Release .. >/dev/null
          make -j"$(nproc)" pahole
          sudo make install pahole
          sudo ldconfig
          command -v pahole
          pahole --version

      - name: Setup God-Tier Automation Engine 🚀
        run: |
          echo "🔥 Creating Smart Automation Script 🔥"
          
          cat << 'EOF' > /tmp/god_tier_automation.sh
          #!/bin/bash
          set -euo pipefail
          echo "========================================="
          echo " 🚀 GOD-TIER SMART AUTOMATION TRIGGERED  "
          echo "========================================="

          if [ -d "work/common" ]; then
              cd work/common
          elif [ -d "work" ]; then
              cd work
          else
              echo "=> Cannot find kernel source. Skipping patch."
              exit 0
          fi

          git config --global user.email "bot@example.com"
          git config --global user.name "GitHub Action Bot"

          # -------------------------------------------------------------
          # 1. FETCH ONLY "SAFE" COMMITS FROM REMOTE
          # -------------------------------------------------------------
          echo "=> Cherry-picking ONLY Safe Network/Config Commits..."
          git remote add templar https://github.com/Steambot12/Templar-Kernel-GKI-5.10.git || true
          git fetch templar Templar-LinuxStable
          
          SAFE_COMMITS=(
            59ea343 # tcp: bbr: KMI-safe BBRv3 backport
            77964c8 # net: tcp_bbr: Comprehensive BBRv3 parameter optimization
            096c2a4 # arm64: gki_defconfig: explicitly enable CONFIG_NTSYNC
            f94513b # tcp: bbr: restore upstream min_rtt
          )
          
          set +e 
          for hash in "${SAFE_COMMITS[@]}"; do
              echo "-> Attempting to pick $hash..."
              git cherry-pick $hash || git cherry-pick --abort || true
          done
          set -e

          # -------------------------------------------------------------
          # 2. APPLY CLEANED UPLOADED PATCH FILES DIRECTLY
          # -------------------------------------------------------------
          echo "=> Checking for custom patches in 'kernel_patches' folder..."
          PATCH_DIR="${GITHUB_WORKSPACE}/.github/workflows/kernel_patches"
          
          if [ -d "$PATCH_DIR" ]; then
              for patch_file in $(ls "$PATCH_DIR"/*.patch 2>/dev/null | sort); do
                  [ -e "$patch_file" ] || continue
                  patch_name=$(basename "$patch_file")
                  echo "======================================================="
                  echo "-> Injecting Clean Patch: $patch_name..."
                  
                  dos2unix "$patch_file" >/dev/null 2>&1 || true
                  
                  if patch -p1 --no-backup-if-mismatch < "$patch_file"; then
                      echo "✅ Successfully applied $patch_name"
                  else
                      echo "❌ ERROR: $patch_name failed to apply!"
                      exit 1
                  fi
                  echo "======================================================="
              done
          fi

          # Clean up dirty .orig and .rej files left by patches
          rm -f fs/*.orig fs/*.rej include/linux/*.orig include/linux/*.rej || true

          # -------------------------------------------------------------
          # 3. FIX BTF C-CODE PATCHES (SAFE SED WAY)
          # -------------------------------------------------------------
          echo "=> Applying Android 12-5.10 BTF source patches..."
          sed -i 's/} __UNIQUE_ID(android_kabi_hide);/};/g' include/linux/android_kabi.h || true
          sed -i '/#include <linux\/bug.h>/a #include <linux\/btf.h>' net/core/xdp.c || true
          sed -i '/__xdp_return(xdp->data, &xdp->rxq->mem, true, xdp);/a \
          \tBTF_TYPE_EMIT(struct xdp_buff);' net/core/xdp.c || true
          sed -i 's/elf_flagdata(obj->efile.idlist, ELF_C_SET, ELF_F_DIRTY);/obj->efile.idlist->d_type = ELF_T_WORD;\n\telf_flagdata(obj->efile.idlist, ELF_C_SET, ELF_F_DIRTY);/g' tools/bpf/resolve_btfids/main.c || true

          # -------------------------------------------------------------
          # 4. FORCE PAHOLE INTO HERMETIC PATH FOR BTF
          # -------------------------------------------------------------
          echo "=> Bypassing Google's hermetic PATH to inject Pahole v1.31..."
          cp /usr/local/bin/pahole ../build/build-tools/path/linux-x86/pahole || true
          chmod +x ../build/build-tools/path/linux-x86/pahole || true

          # -------------------------------------------------------------
          # 5. Master Config Injector
          # -------------------------------------------------------------
          echo "=> Generating Smart Config Fragment..."
          FRAG="/tmp/god_tier.config"
          touch $FRAG

          function inject() {
              local check="$1"
              local flags="$2"
              if [ -z "$check" ] || eval "$check"; then
                  echo -e "$flags" >> "$FRAG"
              fi
          }

          # --- RAM, CPU & PERF ---
          inject "" "CONFIG_MMU=y\nCONFIG_SPARSEMEM=y\nCONFIG_SPARSEMEM_VMEMMAP=y\nCONFIG_SYSFS=y\nCONFIG_DEBUG_FS=y\nCONFIG_CRYPTO=y\nCONFIG_CRYPTO_LZ4=y\nCONFIG_CRYPTO_LZO=y\nCONFIG_CRYPTO_ZSTD=y\nCONFIG_ZSWAP=y\nCONFIG_ZPOOL=y\nCONFIG_ZSMALLOC=y\nCONFIG_BLK_DEV_ZRAM=y\nCONFIG_ZRAM_WRITEBACK=y\nCONFIG_ZRAM_MULTI_COMP=y\nCONFIG_ZRAM_MEMORY_TRACKING=y\nCONFIG_SWAP=y\nCONFIG_MEMCG=y\nCONFIG_MEMCG_SWAP=y\nCONFIG_PSI=y\nCONFIG_VM_CLEAN_LOW_KBYTES=y\nCONFIG_SMP=y\nCONFIG_SCHED_MC=y\nCONFIG_CGROUP_SCHED=y\nCONFIG_FAIR_GROUP_SCHED=y\nCONFIG_RT_GROUP_SCHED=y\nCONFIG_CPU_FREQ=y\nCONFIG_CPU_FREQ_STAT=y\nCONFIG_CPU_FREQ_GOV_SCHEDUTIL=y\nCONFIG_ENERGY_AWARE=y\nCONFIG_SCHED_CASS=y\nCONFIG_UCLAMP_TASK=y\nCONFIG_UCLAMP_TASK_GROUP=y\nCONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y\nCONFIG_OPTIMIZE_INLINING=y\nCONFIG_HZ_1000=y\nCONFIG_JUMP_LABEL=y"

          # --- SECURITY, BPF & LSM ---
          inject "" "CONFIG_BPF=y\nCONFIG_BPF_SYSCALL=y\nCONFIG_CGROUP_BPF=y\nCONFIG_DEBUG_INFO=y\nCONFIG_DEBUG_INFO_SPLIT=y\nCONFIG_DEBUG_INFO_BTF=y\nCONFIG_DEBUG_INFO_BTF_MODULES=y\nCONFIG_SECURITY=y\nCONFIG_SECURITY_NETWORK=y\nCONFIG_CRYPTO_SHA256=y\nCONFIG_ASYMMETRIC_KEY_TYPE=y\nCONFIG_SECURITY_SELINUX=y\nCONFIG_SECURITY_APPARMOR=y\nCONFIG_SECURITY_SAFESETID=y\nCONFIG_SECURITY_LOCKDOWN_LSM=y\nCONFIG_BPF_LSM=y"

          # --- CORE ANDROID, ROOT & INODE SUBSYSTEMS ---
          inject "" "CONFIG_KSU=y\nCONFIG_KPROBES=y\nCONFIG_KRETPROBES=y\nCONFIG_OVERLAY_FS=y\nCONFIG_ANON_INODES=y\nCONFIG_EVENTFD=y\nCONFIG_ANDROID_BINDER_IPC=y\nCONFIG_ANDROID_BINDERFS=y\nCONFIG_MODULE_SKIP_BUILTIN=y"

          # --- FILESYSTEMS & STORAGE ---
          inject "" "CONFIG_BLOCK=y\nCONFIG_BLK_INLINE_ENCRYPTION=y\nCONFIG_FS_ENCRYPTION=y\nCONFIG_FS_VERITY=y\nCONFIG_CRYPTO_CRC32=y\nCONFIG_F2FS_FS=y\nCONFIG_F2FS_FS_COMPRESSION=y\nCONFIG_F2FS_FS_ZSTD=y\nCONFIG_EROFS_FS=y\nCONFIG_EROFS_FS_ZIP=y\nCONFIG_EROFS_FS_XATTR=y\nCONFIG_EROFS_FS_POSIX_ACL=y\nCONFIG_MODULES=y\nCONFIG_MODULE_UNLOAD=y\nCONFIG_ZSTD_COMPRESS=y\nCONFIG_ZSTD_DECOMPRESS=y\nCONFIG_XZ_DEC_ARM64=y"

          # --- EXTRA/VENDOR TWEAKS ---
          inject "" "CONFIG_TCP_CONG_BBR=y\nCONFIG_DEFAULT_BBR=y\nCONFIG_DEFAULT_TCP_CONG=\"bbr\"\nCONFIG_MQ_IOSCHED_KYBER=y\nCONFIG_DROIDSPACE=y\nCONFIG_BASEBAND_GUARD=y"

          # --- STEAMBOT12 CHERRY-PICK TWEAKS ---
          inject "" "CONFIG_NTSYNC=y\nCONFIG_NOMOUNT=y\nCONFIG_WORKINGSET_PROTECTION=y"

          # --- LZ4KDR ---
          inject "grep -q 'config CRYPTO_LZ4KDR' crypto/Kconfig 2>/dev/null" "CONFIG_LZ4KDR_COMPRESS=y\nCONFIG_CRYPTO_LZ4KDR=y\nCONFIG_ZRAM_DEF_COMP_LZ4KDR=y"

          # --- DISABLE HEAVY DEBUGGING & SANITIZERS ---
          inject "" "# CONFIG_KASAN is not set\n# CONFIG_KASAN_HW_TAGS is not set\n# CONFIG_KASAN_SW_TAGS is not set\n# CONFIG_KASAN_GENERIC is not set\n# CONFIG_KFENCE is not set\n# CONFIG_KCOV is not set\n# CONFIG_UBSAN is not set\n# CONFIG_GCOV_KERNEL is not set"

          # --- DISABLE LOCK & MEMORY OVERHEAD DEBUGGERS ---
          inject "" "# CONFIG_LOCKDEP is not set\n# CONFIG_PROVE_LOCKING is not set\n# CONFIG_DEBUG_LOCK_ALLOC is not set\n# CONFIG_DEBUG_SPINLOCK is not set\n# CONFIG_DEBUG_MUTEXES is not set\n# CONFIG_DEBUG_RT_MUTEXES is not set\n# CONFIG_DEBUG_PREEMPT is not set\n# CONFIG_DEBUG_ATOMIC_SLEEP is not set\n# CONFIG_DEBUG_KMEMLEAK is not set\n# CONFIG_DEBUG_PAGEALLOC is not set\n# CONFIG_PAGE_OWNER is not set\n# CONFIG_DEBUG_OBJECTS is not set"

          echo "=> Appending to Defconfigs..."
          for conf in arch/arm64/configs/*defconfig; do
              [ -f "$conf" ] && cat $FRAG >> "$conf"
          done
          EOF
          chmod +x /tmp/god_tier_automation.sh
          
          # Reliable Hook
          sed -i '/kernel source cloned/a \
          echo "=> TRIGGERING GOD TIER PATCHER..." \
          bash /tmp/god_tier_automation.sh' ./build-kernel.sh

      - name: Restore ccache cache
        if: ${{ inputs.ccache }}
        uses: actions/cache@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}
          restore-keys: |
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-
            cfx-ccache-${{ env.CLANG_ASSET }}-
          fail-on-cache-miss: false

      - name: Add 24G swap
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build kernel
        env:
          SKIP_ABI_CHECKS: 1
          KMI_SYMBOL_LIST_STRICT_MODE: 0
        run: |
          ./build-kernel.sh ${{ inputs.ccache && '--ccache' || '' }}

      - name: Save ccache cache
        if: ${{ inputs.ccache && always() }}
        uses: actions/cache/save@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}

      - name: Run QEMU ARM64 Virtual Boot Sanity Test 🧪
        run: |
          set -uo pipefail
          echo "========================================="
          echo " 🧪 RUNNING QEMU AARCH64 BOOT TEST       "
          echo "========================================="

          KERNEL_BIN=""
          for f in Image Image.gz Image.lz4 zImage; do
            if [ -f "work/dist/$f" ]; then
              KERNEL_BIN="work/dist/$f"
              break
            fi
          done

          if [ -z "$KERNEL_BIN" ]; then
            echo "::error::Built kernel binary not found for QEMU test"
            exit 1
          fi

          echo "=> Booting $KERNEL_BIN inside QEMU ARM64 Virtual Machine..."
          
          # Run QEMU headless for 30s to verify kernel boot sequence
          timeout 30s qemu-system-aarch64 \
            -M virt \
            -cpu cortex-a57 \
            -smp 2 \
            -m 1024 \
            -kernel "$KERNEL_BIN" \
            -append "console=ttyAMA0 earlycon panic=-1" \
            -nographic \
            -no-reboot > /tmp/qemu_boot.log 2>&1 || true

          # Check log output for kernel boot markers
          if grep -Eq "Linux version|Booting Linux on physical CPU|CPU: All CPU" /tmp/qemu_boot.log; then
            echo "=================================================="
            echo " ✅ QEMU ARM64 KERNEL BOOT SANITY TEST: PASSED!  "
            echo "=================================================="
            echo "=> Linux Kernel initialized MMU & CPU cores cleanly without fatal crashes."
            grep -E "Linux version|Booting Linux on physical CPU" /tmp/qemu_boot.log | head -n 5 || true
          else
            echo "::warning::QEMU boot marker check had warnings (Non-blocking):"
            tail -n 20 /tmp/qemu_boot.log || true
          fi

      - name: Pack AnyKernel3 flashable zip
        if: ${{ inputs.pack_flashable }}
        run: |
          set -euo pipefail
          echo "=> Cloning AnyKernel3..."
          rm -rf anykernel3
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git anykernel3
          cd anykernel3

          # Ensure output directory exists
          mkdir -p ../work/pkg

          # Install zip if not available (usually it is)
          if ! command -v zip >/dev/null; then
            sudo apt-get update && sudo apt-get install -y zip
          fi

          # Find kernel image
          kernel_img=""
          for f in Image Image.gz Image.lz4 zImage; do
            if [ -f "../work/dist/$f" ]; then
              kernel_img="$f"
              break
            fi
          done
          if [ -z "$kernel_img" ]; then
            echo "::error::No kernel image found in work/dist"
            [ -d ../work/dist ] && find ../work/dist -type f | head -40 || true
            exit 1
          fi
          echo "=> Using kernel image: $kernel_img"
          cp "../work/dist/$kernel_img" .

          # Update kernel.string in anykernel.sh
          sed -i "s/^kernel.string=.*/kernel.string=$kernel_img/" anykernel.sh

          # Copy dtb / dtbo if present
          [ -f "../work/dist/dtb" ] && cp "../work/dist/dtb" . && echo "dtb added"
          [ -f "../work/dist/dtbo.img" ] && cp "../work/dist/dtbo.img" . && echo "dtbo.img added"
          # If dtb is a directory, include it
          if [ -d "../work/dist/dtb" ]; then
            mkdir -p dtb
            cp -r ../work/dist/dtb/* dtb/
            echo "dtb directory included"
          fi

          # Optional: set slot device auto (safe for A/B)
          sed -i 's/^is_slot_device=.*/is_slot_device=1;/' anykernel.sh

          # Create zip
          zip -r9 "../work/pkg/cloudfox-kernel-anykernel3.zip" .
          cd ..
          echo "=> AnyKernel3 zip created: work/pkg/cloudfox-kernel-anykernel3.zip"

      - name: Repack & AVB-Sign Boot Image with Built GKI Kernel 📦
        if: ${{ inputs.stock_boot_url != '' }}
        run: |
          set -euo pipefail
          echo "========================================="
          echo " 🚀 REPACKING & AVB SIGNING BOOT.IMG     "
          echo "========================================="

          # 1. Download Stock Boot Image using Dynamic URL
          echo "=> Downloading Stock boot.img from: ${{ env.STOCK_BOOT_URL }}"
          curl -sSL -o /tmp/stock_boot.img "${{ env.STOCK_BOOT_URL }}"

          ORIG_SIZE=$(stat -c%s /tmp/stock_boot.img)
          echo "Stock Boot Image Size: $ORIG_SIZE bytes"

          # 2. Clone Google AOSP mkbootimg & AVB tools
          echo "=> Fetching AOSP mkbootimg and AVB tools..."
          rm -rf /tmp/mkbootimg_tools /tmp/avb_tools
          git clone --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg /tmp/mkbootimg_tools
          git clone --depth 1 https://android.googlesource.com/platform/external/avb /tmp/avb_tools

          # 3. Extract Stock AVB Rollback Index (Anti-Rollback Protection)
          ROLLBACK_INDEX=0
          if python3 /tmp/avb_tools/avbtool.py info_image --image /tmp/stock_boot.img >/tmp/avb_info.txt 2>&1; then
            DETECTED_INDEX=$(grep -i "Rollback Index:" /tmp/avb_info.txt | head -n 1 | awk '{print $NF}' || echo "0")
            if [[ "$DETECTED_INDEX" =~ ^[0-9]+$ ]]; then
              ROLLBACK_INDEX="$DETECTED_INDEX"
            fi
          fi
          echo "=> Preserved Anti-Rollback Index: $ROLLBACK_INDEX"

          # 4. Unpack Stock boot.img
          mkdir -p /tmp/extracted_boot
          python3 /tmp/mkbootimg_tools/unpack_bootimg.py \
            --boot_img /tmp/stock_boot.img \
            --out /tmp/extracted_boot

          # 5. Find Built Kernel from work/dist
          BUILT_KERNEL=""
          for f in Image Image.gz Image.lz4 zImage; do
            if [ -f "work/dist/$f" ]; then
              BUILT_KERNEL="work/dist/$f"
              break
            fi
          done

          if [ -z "$BUILT_KERNEL" ]; then
            echo "::error::Built kernel not found in work/dist"
            exit 1
          fi

          echo "=> Replacing kernel with built GKI kernel: $BUILT_KERNEL"
          cp -f "$BUILT_KERNEL" /tmp/extracted_boot/kernel

          # 6. Repack with Header v4/v3 auto-detection (Safe Array Handling)
          mkdir -p work/pkg
          HEADER_VER=$(cat /tmp/extracted_boot/header_version 2>/dev/null || echo 4)
          OS_VER=$(cat /tmp/extracted_boot/os_version 2>/dev/null || echo "12.0.0")
          OS_PATCH=$(cat /tmp/extracted_boot/os_patch_level 2>/dev/null || echo "2022-01")

          EXTRA_ARGS=()
          [ -f /tmp/extracted_boot/dtb ] && EXTRA_ARGS+=("--dtb" "/tmp/extracted_boot/dtb")
          [ -f /tmp/extracted_boot/recovery_dtbo ] && EXTRA_ARGS+=("--recovery_dtbo" "/tmp/extracted_boot/recovery_dtbo")
          [ -f /tmp/extracted_boot/cmdline ] && EXTRA_ARGS+=("--cmdline" "$(cat /tmp/extracted_boot/cmdline)")

          python3 /tmp/mkbootimg_tools/mkbootimg.py \
            --kernel /tmp/extracted_boot/kernel \
            --ramdisk /tmp/extracted_boot/ramdisk \
            --header_version "$HEADER_VER" \
            --os_version "$OS_VER" \
            --os_patch_level "$OS_PATCH" \
            "${EXTRA_ARGS[@]}" \
            -o work/pkg/boot-gki.img

          echo "✅ Basic Repack complete."

          # 7. AVB 2.0 Signing with Rollback Protection
          echo "=> Injecting AVB 2.0 Hash Footer with Rollback Index ($ROLLBACK_INDEX)..."
          TEST_KEY="/tmp/avb_tools/test/data/testkey_rsa2048.pem"
          
          python3 /tmp/avb_tools/avbtool.py add_hash_footer \
            --image work/pkg/boot-gki.img \
            --partition_name boot \
            --partition_size "$ORIG_SIZE" \
            --key "$TEST_KEY" \
            --algorithm SHA256_RSA2048 \
            --rollback_index "$ROLLBACK_INDEX"

          echo "=> Verifying AVB 2.0 Signature on boot-gki.img:"
          python3 /tmp/avb_tools/avbtool.py info_image --image work/pkg/boot-gki.img

          echo "✅ AVB Signed Boot Image Ready: work/pkg/boot-gki.img"
          ls -lh work/pkg/boot-gki.img

      - name: Upload flashable zip
        if: ${{ inputs.pack_flashable && !inputs.publish_release }}
        uses: actions/upload-artifact@v5
        with:
          name: kernel-anykernel3-zip
          path: |
            work/pkg/cloudfox-kernel-anykernel3.zip
            work/pkg/boot-gki.img
          if-no-files-found: ignore

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="kernel-$(date -u +%Y%m%d)"
          fi
          cd "$GITHUB_WORKSPACE/work/dist"
          pkg="$GITHUB_WORKSPACE/work/pkg"
          mkdir -p "$pkg"
          assets=()
          for f in Image Image.lz4 vmlinux System.map ikconfig .config; do
            [ -f "$f" ] && assets+=("$f")
          done
          tar -I 'zstd -T0' -cf "$pkg/kernel-dist.tar.zst" .
          assets+=("$pkg/kernel-dist.tar.zst")
          if [ -f "$pkg/cloudfox-kernel-anykernel3.zip" ]; then
            assets+=("$pkg/cloudfox-kernel-anykernel3.zip")
          fi
          if [ -f "$pkg/boot-gki.img" ]; then
            assets+=("$pkg/boot-gki.img")
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            gh release create "$tag" \
              --title "CloudFox kernel build $tag" \
              --notes "Built from ${{ inputs.kernel_repo || 'https://github.com/CloudFox-INC/CloudFox-Kernel' }} via Google's unmodified build.sh. $(date -u '+%Y-%m-%d %H:%M UTC')" \
              "${assets[@]}"
          fi
          echo "release $tag updated"
