name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (optional)'
        required: false
        type: string

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    
    env:
      KERNEL_REPO: https://github.com/Steambot12/Templar-Kernel-GKI-5.10.git
      KERNEL_BRANCH: Linux1-Staging
      CLANG_ASSET: clang-r536225-linux-x86.tar.zst
      CCACHE_OPT: 1
      RELEASE_TAG: ${{ github.event.inputs.release_tag }}
      KSU_PREBUILT_BASE: https://github.com/Chor-A/Kernel/releases/download/prebuilts

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          repository: Chor-A/Kernel
          clean: true
          fetch-depth: 1

      - name: Free Disk Space
        run: |
          if [ -f "build/free-disk-space.sh" ]; then
            sudo bash build/free-disk-space.sh
          fi
          df -h
          git config --global --add safe.directory "*"

      - name: Setup Cache
        uses: actions/cache@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ env.KERNEL_REPO }}-${{ env.KERNEL_BRANCH }}

      - name: Setup Swap Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build Kernel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ksu_pid=""
          if [ "true" == "true" ]; then
            ./build/kernelsu-fetch.sh &
            ksu_pid=$!
          fi
          
          mkdir -p work
          INJECT_SCRIPT="$GITHUB_WORKSPACE/work/patch_inject.sh"
          
          cat << 'INJECT_EOF' > "$INJECT_SCRIPT"
          #!/bin/bash
          export PATH="/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin:$PATH"
          
          # Navigate into the kernel source directory
          cd common || exit 1
          
          echo "=== 0. Completely Removing nomount ==="
          rm -rf fs/nomount fs/nomount.c fs/nomount.h
          sed -i '/nomount/Id' fs/Makefile
          sed -i '/NOMOUNT/Id' fs/Kconfig
          sed -i '/nomount/Id' fs/Kconfig
          echo "✅ nomount completely removed from tree!"
          
          echo "=== 1. Setting up ReSukiSU ==="
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash - || true
          
          echo "=== 2. Applying Original Patches (Smart Offset Mode) ==="
          for dir in "$GITHUB_WORKSPACE/.github/workflows/patches" "$GITHUB_WORKSPACE/patches"; do
            if [ -d "$dir" ]; then
              for patch_file in "$dir"/*.patch; do
                if [ -f "$patch_file" ]; then
                  echo "----------------------------------------------------"
                  echo "Applying $patch_file..."
                  sed -i 's/\r$//' "$patch_file"
                  
                  if git apply --verbose --ignore-whitespace --whitespace=nowarn "$patch_file" > patch.log 2>&1; then
                    echo "✅ Applied cleanly via git!"
                  else
                    if patch -p1 --no-backup-if-mismatch < "$patch_file" >> patch.log 2>&1; then
                      echo "✅ Applied successfully via patch tool (Offsets resolved)!"
                    else
                      echo "❌ ERROR: $patch_file failed!"
                      cat patch.log
                      exit 1
                    fi
                  fi
                  rm -f patch.log
                fi
              done
            fi
          done
          echo "✅ All .patch files applied successfully!"
          
          echo "=== 3. Enabling SUSFS & Zeromount Flags in gki_defconfig ==="
          sed -i 's/CONFIG_KSU=m/CONFIG_KSU=y/g' arch/arm64/configs/gki_defconfig || true
          cat << 'KSUCONF' >> arch/arm64/configs/gki_defconfig
          CONFIG_KSU=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          
          # --- Enabling MGLRU explicitly for compiling ---
          
          
          # --- SUSFS Base Flags ---
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          
          # --- SUSFS Enhanced & Hardened Flags ---
          CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT=y
          CONFIG_KSU_SUSFS_UNICODE_FILTER=y
          CONFIG_KSU_SUSFS_HIDDEN_NAME=y
          CONFIG_KSU_SUSFS_HARDENED=y
          
          # --- Zeromount Flags ---
          CONFIG_ZEROMOUNT=y
          CONFIG_ZERO_MOUNT=y
          KSUCONF
          
          echo "✅ All configs applied directly on tree!"
          INJECT_EOF
          
          chmod +x "$INJECT_SCRIPT"
          
          # Original Developer Hook
          export APPEND_BUILD_ENV="PRE_DEFCONFIG_CMDS=$INJECT_SCRIPT,KMI_SYMBOL_LIST_STRICT_MODE=0,UPDATE_SYMBOL_LIST=1"
          
          chmod +x ./build-kernel.sh
          ./build-kernel.sh --ccache
          
          if [ -n "$ksu_pid" ]; then
            wait "$ksu_pid" || echo "::warning::ksud fetch failed; flashable zip will be skipped"
          fi

      - name: Pack Flashable Zip
        run: |
          set -euo pipefail
          if [ ! -f "$PWD/kernelsu/ksud-aarch64-linux-android" ] || \
             [ ! -f "$PWD/kernelsu/ksud-armv7-linux-androideabi" ]; then
            echo "ksud binaries missing (fetch failed); skipping flashable zip"
            exit 0
          fi
          
          kernel_img=$(find work/dist -name 'Image' -print -quit)
          if [ -z "$kernel_img" ]; then
            kernel_img=$(find work/dist -name 'Image.lz4' -print -quit)
          fi
          
          if [ -z "$kernel_img" ]; then
            echo "no kernel Image found in work/dist" >&2
            find work/dist -type f | head -40
            exit 1
          fi
          
          mkdir -p work/pkg
          KERNEL_IMAGE="$kernel_img" \
          KSUD_ARM64="$PWD/kernelsu/ksud-aarch64-linux-android" \
          KSUD_ARMV7="$PWD/kernelsu/ksud-armv7-linux-androideabi" \
          ZIP_OUT="$PWD/work/pkg/cloudfox-kernel-flash.zip" \
            ./build/pack-flashable.sh

      - name: Upload Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="kernel-$(date -u +%Y%m%d)"
          fi
          
          cd "$GITHUB_WORKSPACE/work/dist"
          pkg="$GITHUB_WORKSPACE/work/pkg"
          mkdir -p "$pkg"
          
          assets=()
          for f in Image Image.lz4 Image.gz vmlinux System.map ikconfig .config; do
            [ -f "$f" ] && assets+=("$f")
          done
          
          tar -I 'zstd -T0' -cf "$pkg/kernel-dist.tar.zst" .
          assets+=("$pkg/kernel-dist.tar.zst")
          
          if [ -f "$pkg/cloudfox-kernel-flash.zip" ]; then
            assets+=("$pkg/cloudfox-kernel-flash.zip")
          fi
          
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            gh release create "$tag" \
              --title "Templar/ReSukiSU Kernel $tag" \
              --notes "Compiled 5.10 Build. Nomount removed, Zeromount added, Original patches active! MGLRU & ALL SUSFS Configs applied natively ✅  $(date -u '+%Y-%m-%d UTC')" \
              "${assets[@]}"
          fi
