name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (optional)'
        required: false
        type: string

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    
    env:
      KERNEL_REPO: https://github.com/Steambot12/Templar-Kernel-GKI-5.10.git
      KERNEL_BRANCH: Linux1-Staging
      CLANG_ASSET: clang-r536225-linux-x86.tar.zst
      CCACHE_OPT: 1
      RELEASE_TAG: ${{ github.event.inputs.release_tag }}
      KSU_PREBUILT_BASE: https://github.com/Chor-A/Kernel/releases/download/prebuilts

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          repository: Chor-A/Kernel
          clean: true
          fetch-depth: 1

      - name: Free Disk Space
        run: |
          if [ -f "build/free-disk-space.sh" ]; then
            sudo bash build/free-disk-space.sh
          fi
          df -h
          git config --global --add safe.directory "*"

      - name: Setup Cache
        uses: actions/cache@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ env.KERNEL_REPO }}-${{ env.KERNEL_BRANCH }}

      - name: Setup Swap Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build Kernel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ksu_pid=""
          if [ "true" == "true" ]; then
            ./build/kernelsu-fetch.sh &
            ksu_pid=$!
          fi
          
          mkdir -p work
          INJECT_SCRIPT="$GITHUB_WORKSPACE/work/patch_inject.sh"
          
          cat << 'INJECT_EOF' > "$INJECT_SCRIPT"
          #!/bin/bash
          export PATH="/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin:$PATH"
          cd common || exit 1

          echo "=== 1. Cleaning Nomount ==="
          rm -rf fs/nomount fs/nomount.c fs/nomount.h
          sed -i '/nomount/Id' fs/Makefile
          sed -i '/NOMOUNT/Id' fs/Kconfig

          echo "=== 2. Setting up ReSukiSU ==="
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash - || true

          echo "=== 3. Applying Patches Safely ==="
          # HUM GIT APPLY USE NAHI KARENGE. Standard 'patch' zyada smart hai aur line counts ignore karta hai.
          for patch_file in "$GITHUB_WORKSPACE/.github/workflows/patches"/*.patch "$GITHUB_WORKSPACE/patches"/*.patch; do
              if [ -f "$patch_file" ]; then
                  echo "Applying $(basename "$patch_file")..."
                  sed -i 's/\r$//' "$patch_file"
                  patch -p1 --forward --no-backup-if-mismatch < "$patch_file" || echo "Some hunks rejected, manual fallback will fix them."
              fi
          done

          echo "=== 4. MANUAL KERNEL INJECTIONS (Bypassing Rejects) ==="
          # A. Force add to Makefile (Iske bina Error 2 aata hai)
          grep -q "susfs.o" fs/Makefile || sed -i '$a obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile
          grep -q "zeromount.o" fs/Makefile || sed -i '$a obj-$(CONFIG_ZEROMOUNT) += zeromount.o' fs/Makefile

          # B. Fix mount.h for Android GKI (13 namespace errors khatam)
          if ! grep -q "susfs_mnt_id_backup" include/linux/mount.h; then
              sed -i '/int mnt_flags;/a #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\tint susfs_mnt_id_backup;\n#endif' include/linux/mount.h
          fi

          # C. Fix fdinfo.c unused label error
          sed -i '/orig_flow:/d' fs/notify/fdinfo.c 2>/dev/null || true

          # D. Fix susfs_def.h missing function declaration
          if ! grep -q "susfs_is_current_proc_umounted_app" include/linux/susfs_def.h; then
              echo -e "\nstatic inline bool susfs_is_current_proc_umounted_app(void) {\n\treturn test_ti_thread_flag(&current->thread_info, 33);\n}" >> include/linux/susfs_def.h
          fi

          # E. Fix ZeroMount headers in task_mmu.c (Agar reject hua ho)
          if ! grep -q "zeromount.h" fs/proc/task_mmu.c; then
              sed -i '/#include <linux\/pkeys.h>/a #ifdef CONFIG_ZEROMOUNT\n#include <linux/zeromount.h>\n#endif' fs/proc/task_mmu.c 2>/dev/null || true
          fi

          echo "=== 5. Injecting Kconfig Flags ==="
          cat << 'KSUKCONF' >> fs/Kconfig
          config KSU_SUSFS
              bool "KSU SUSFS"
          config KSU_SUSFS_SUS_PATH
              bool
          config KSU_SUSFS_SUS_MOUNT
              bool
          config KSU_SUSFS_SUS_KSTAT
              bool
          config KSU_SUSFS_SPOOF_UNAME
              bool
          config KSU_SUSFS_ENABLE_LOG
              bool
          config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
              bool
          config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
              bool
          config KSU_SUSFS_OPEN_REDIRECT
              bool
          config KSU_SUSFS_SUS_MAP
              bool
          config KSU_SUSFS_SUS_KSTAT_REDIRECT
              bool
          config KSU_SUSFS_UNICODE_FILTER
              bool
          config KSU_SUSFS_HIDDEN_NAME
              bool
          config KSU_SUSFS_HARDENED
              bool
          config ZEROMOUNT
              bool "Zeromount"
          config ZERO_MOUNT
              bool
          KSUKCONF

          echo "=== 6. Enabling Flags in Defconfig ==="
          sed -i 's/CONFIG_KSU=m/CONFIG_KSU=y/g' arch/arm64/configs/gki_defconfig || true
          cat << 'KSUCONF' >> arch/arm64/configs/gki_defconfig
          CONFIG_KSU=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT=y
          CONFIG_KSU_SUSFS_UNICODE_FILTER=y
          CONFIG_KSU_SUSFS_HIDDEN_NAME=y
          CONFIG_KSU_SUSFS_HARDENED=y
          CONFIG_ZEROMOUNT=y
          CONFIG_ZERO_MOUNT=y
          KSUCONF

          echo "✅ Inject Script Completed Successfully!"
          INJECT_EOF
          
          chmod +x "$INJECT_SCRIPT"
          
          # Original Developer Hook
          export APPEND_BUILD_ENV="PRE_DEFCONFIG_CMDS=$INJECT_SCRIPT,KMI_SYMBOL_LIST_STRICT_MODE=0,UPDATE_SYMBOL_LIST=1"
          
          chmod +x ./build-kernel.sh
          ./build-kernel.sh --ccache
          
          if [ -n "$ksu_pid" ]; then
            wait "$ksu_pid" || echo "::warning::ksud fetch failed; flashable zip will be skipped"
          fi

      - name: Upload Reject Report as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-reject-report
          path: patch_reject_summary.log
          if-no-files-found: ignore

      - name: Pack Flashable Zip
        run: |
          set -euo pipefail
          if [ ! -f "$PWD/kernelsu/ksud-aarch64-linux-android" ] || \
             [ ! -f "$PWD/kernelsu/ksud-armv7-linux-androideabi" ]; then
            echo "ksud binaries missing (fetch failed); skipping flashable zip"
            exit 0
          fi
          
          kernel_img=$(find work/dist -name 'Image' -print -quit)
          if [ -z "$kernel_img" ]; then
            kernel_img=$(find work/dist -name 'Image.lz4' -print -quit)
          fi
          
          if [ -z "$kernel_img" ]; then
            echo "no kernel Image found in work/dist" >&2
            find work/dist -type f | head -40
            exit 1
          fi
          
          mkdir -p work/pkg
          KERNEL_IMAGE="$kernel_img" \
          KSUD_ARM64="$PWD/kernelsu/ksud-aarch64-linux-android" \
          KSUD_ARMV7="$PWD/kernelsu/ksud-armv7-linux-androideabi" \
          ZIP_OUT="$PWD/work/pkg/cloudfox-kernel-flash.zip" \
            ./build/pack-flashable.sh

      - name: Upload Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="kernel-$(date -u +%Y%m%d)"
          fi
          
          cd "$GITHUB_WORKSPACE/work/dist"
          pkg="$GITHUB_WORKSPACE/work/pkg"
          mkdir -p "$pkg"
          
          assets=()
          for f in Image Image.lz4 Image.gz vmlinux System.map ikconfig .config; do
            [ -f "$f" ] && assets+=("$f")
          done
          
          tar -I 'zstd -T0' -cf "$pkg/kernel-dist.tar.zst" .
          assets+=("$pkg/kernel-dist.tar.zst")
          
          if [ -f "$pkg/cloudfox-kernel-flash.zip" ]; then
            assets+=("$pkg/cloudfox-kernel-flash.zip")
          fi
          
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            gh release create "$tag" \
              --title "Templar/ReSukiSU Kernel $tag" \
              --notes "Compiled 5.10 Build. Nomount removed, Zeromount added, Original patches active! ALL SUSFS & Zeromount Configs applied natively ✅  $(date -u '+%Y-%m-%d UTC')" \
              "${assets[@]}"
          fi
