name: build-kernel

on:
  schedule:
    - cron: "0 22 * * *" # Daily 3:30 AM IST (22:00 UTC)
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the build as a GitHub release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (auto-generated as kernel-YYYYMMDD when empty)'
        required: false
        default: ""
      kernel_repo:
        description: 'Kernel source repository (full URL)'
        required: false
        default: "https://github.com/Steambot12/Templar-Kernel-GKI-5.10"
      kernel_branch:
        description: 'Kernel source branch'
        required: false
        default: "Linux1-Staging"
      kernel_commit:
        description: 'Kernel source commit'
        required: false
        default: ""
      clang_version:
        description: Clang toolchain version
        required: false
        type: choice
        options:
          - clang 19
          - clang 14
        default: "clang 19"
      defconfig_fragment_exclude:
        description: 'Defconfig fragments to exclude'
        required: false
        default: ""
      append_build_env:
        description: 'Extra KEY=VALUE pairs appended to build.config'
        required: false
        default: ""
      append_config:
        description: 'Extra literal CONFIG_* lines injected into the defconfig'
        required: false
        default: "CONFIG_KSU=y,CONFIG_KSU_TOOLKIT_SUPPORT=y,CONFIG_KSU_SENTINEL=y,CONFIG_KSU_INLINE_HOOK=y,CONFIG_KSU_DISABLE_SELINUX_VFS_GETXATTR=y,CONFIG_KSU_DEBUG=n,CONFIG_KSU_SUCOMPAT=n,CONFIG_OVERLAY_FS=y,CONFIG_KPROBES=y,CONFIG_HAVE_KPROBES=y,CONFIG_KPROBE_EVENTS=y,CONFIG_LRU_GEN=y,CONFIG_LRU_GEN_ENABLED=y,CONFIG_NOMOUNT=y"
      ccache:
        description: 'Accelerate with ccache.'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-build-${{ github.event.inputs.release_tag || 'default' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      KERNEL_COMMIT: ${{ inputs.kernel_commit }}
      CLANG_ASSET: ${{ fromJSON('{"clang 14":"clang-r450784e-linux-x86.tar.zst","clang 19":"clang-r536225-linux-x86.tar.zst"}')[inputs.clang_version] }}
      DEFCONFIG_FRAGMENT_EXCLUDE: ${{ inputs.defconfig_fragment_exclude }}
      APPEND_BUILD_ENV: ${{ inputs.append_build_env }}
      APPEND_CONFIG: ${{ inputs.append_config }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CCACHE_OPT: ${{ inputs.ccache && '1' || '' }}
      GITHUB_TOKEN: ${{ github.token }}
      KMI_SYMBOL_LIST_STRICT_MODE: "0"
      UPDATE_SYMBOL_LIST: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          if [ -f "build/free-disk-space.sh" ]; then
            sudo bash build/free-disk-space.sh
          fi
          df -h

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory "*"

      - name: Restore ccache cache
        if: ${{ inputs.ccache }}
        uses: actions/cache@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}-${{ github.run_id }}
          restore-keys: |
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}-
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-
          fail-on-cache-miss: false

      - name: Add 24G swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Clone Kernel Source
        run: |
          mkdir -p work
          git clone -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} work/common
          cd work/common

          if [ -n "${{ env.KERNEL_COMMIT }}" ]; then
            git checkout ${{ env.KERNEL_COMMIT }}
          fi

      - name: Apply SUSFS, Custom Patches & Direct Code Spoofing
        run: |
          cd work/common

          echo "=== 1. Integrating SUSFS into Kernel ==="
          git clone --depth=1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          cp -r ../susfs4ksu/kernel_patches/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch || echo "Warning: SUSFS patch issue"
          
          # Fix missing cred.h in SuSFS definitions for current_uid()
          sed -i '1i #include <linux/cred.h>' include/linux/susfs_def.h
          echo "✅ Fixed current_uid() missing header in susfs_def.h"

          # Fix missing SuSFS header and cred.h in statfs.c to prevent implicit declaration error
          sed -i '1i #include <linux/cred.h>' fs/statfs.c
          sed -i '2i #include <linux/susfs.h>' fs/statfs.c
          
          # FIX FOR PATCH BUG: Force the extern declaration above where it gets called
          sed -i '/#include "internal.h"/a #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\nextern int susfs_sus_kstat_spoof_vfs_statfs(struct inode *inode, struct kstatfs *buf, bool *is_fuse);\n#endif' fs/statfs.c
          echo "✅ Fixed SuSFS compilation headers and patch structural bugs!"

          # Safety fallback for symbol compatibility
          echo "int __attribute__((weak)) ksu_install_su_fd(struct file *file) { return 0; }" >> fs/susfs.c

          echo "=== 2. Applying Custom Patches (mglru, services, etc.) ==="
          for dir in "$GITHUB_WORKSPACE/.github/workflows/patches" "$GITHUB_WORKSPACE/patches"; do
            if [ -d "$dir" ]; then
              for patch_file in "$dir"/*.patch; do
                if [ -f "$patch_file" ]; then
                  echo "Applying $patch_file..."
                  sed -i 's/\r$//' "$patch_file"
                  if git apply --verbose --ignore-whitespace --whitespace=nowarn "$patch_file"; then
                    echo "Applied via git apply"
                  elif patch -p1 -N --no-backup-if-mismatch < "$patch_file"; then
                    echo "Applied via patch"
                  else
                    echo "Warning: $patch_file partially skipped or failed"
                  fi
                fi
              done
            fi
          done
          echo "✅ All .patch files applied!"

          echo "=== 3. Directly Injecting Spoof Modifications via Python ==="
          python3 - << 'EOF'
          import os
          import re

          # 1. Modify fs/proc/cmdline.c (ULTRA CACHE & DOUBLE-CHECKED LOCK OPTIMIZED)
          cmdline_path = "fs/proc/cmdline.c"
          if os.path.exists(cmdline_path):
              with open(cmdline_path, "r") as f:
                  content = f.read()
              
              helper_code = r"""
          #include <linux/slab.h>
          #include <linux/string.h>
          #include <linux/cred.h>
          #include <linux/mutex.h>
          #include <linux/compiler.h>

          static void replace_str(char *buf, size_t max_len, const char *search, const char *replace)
          {
          	char *p = buf;
          	size_t s_len = strlen(search);
          	size_t r_len = strlen(replace);

          	while ((p = strstr(p, search)) != NULL) {
          		size_t cur_len = strlen(buf);
          		size_t tail_len = strlen(p + s_len);
          		if (r_len > s_len && cur_len + (r_len - s_len) >= max_len)
          			break;
          		if (r_len != s_len)
          			memmove(p + r_len, p + s_len, tail_len + 1);
          		memcpy(p, replace, r_len);
          		p += r_len;
          	}
          }
          """
              
              replacement_func = r"""
          static char *spoofed_cmdline = NULL;
          static DEFINE_MUTEX(spoofed_cmdline_mutex);

          static int cmdline_proc_show(struct seq_file *m, void *v)
          {
          	if (!saved_command_line) {
          		seq_putc(m, 10);
          		return 0;
          	}

          	/* App calling uid >= 10000 is likely true for all normal Android usage */
          	if (likely(__kuid_val(current_uid()) >= 10000)) {
          		/* Only take the heavy mutex lock if string ISN'T created yet (unlikely scenario after 1st boot check) */
          		if (unlikely(!spoofed_cmdline)) {
          			mutex_lock(&spoofed_cmdline_mutex);
          			if (!spoofed_cmdline) {
          				size_t len = strlen(saved_command_line);
          				spoofed_cmdline = kzalloc(len + 256, GFP_KERNEL);
          				if (spoofed_cmdline) {
          					memcpy(spoofed_cmdline, saved_command_line, len + 1);
          					replace_str(spoofed_cmdline, len + 256, "androidboot.verifiedbootstate=orange", "androidboot.verifiedbootstate=green");
          					replace_str(spoofed_cmdline, len + 256, "androidboot.verifiedbootstate=yellow", "androidboot.verifiedbootstate=green");
          					replace_str(spoofed_cmdline, len + 256, "androidboot.verifiedbootstate=red", "androidboot.verifiedbootstate=green");
          					replace_str(spoofed_cmdline, len + 256, "androidboot.vbmeta.device_state=unlocked", "androidboot.vbmeta.device_state=locked");
          					replace_str(spoofed_cmdline, len + 256, "androidboot.flash.locked=0", "androidboot.flash.locked=1");
          					replace_str(spoofed_cmdline, len + 256, "androidboot.selinux=permissive", "androidboot.selinux=enforcing");
          					replace_str(spoofed_cmdline, len + 256, "androidboot.buildvariant=userdebug", "androidboot.buildvariant=user");
          					replace_str(spoofed_cmdline, len + 256, "androidboot.buildvariant=eng", "androidboot.buildvariant=user");
          					replace_str(spoofed_cmdline, len + 256, "buildvariant=userdebug", "buildvariant=user");
          					replace_str(spoofed_cmdline, len + 256, "buildvariant=eng", "buildvariant=user");
          					replace_str(spoofed_cmdline, len + 256, "androidboot.mode=custom", "androidboot.mode=normal");
          					replace_str(spoofed_cmdline, len + 256, "androidboot.mode=recovery", "androidboot.mode=normal");
          					replace_str(spoofed_cmdline, len + 256, "androidboot.secureboot=0", "androidboot.secureboot=1");
          					replace_str(spoofed_cmdline, len + 256, "androidboot.lockstate=unlocked", "androidboot.lockstate=locked");
          					replace_str(spoofed_cmdline, len + 256, "androidboot.warranty_bit=1", "androidboot.warranty_bit=0");
          					replace_str(spoofed_cmdline, len + 256, "androidboot.warranty_bits=1", "androidboot.warranty_bits=0");
          					replace_str(spoofed_cmdline, len + 256, "androidboot.force_normal_boot=0", "androidboot.force_normal_boot=1");
          				}
          			}
          			mutex_unlock(&spoofed_cmdline_mutex);
          		}

          		if (likely(spoofed_cmdline)) {
          			seq_puts(m, spoofed_cmdline);
          			seq_putc(m, 10);
          			return 0;
          		}
          	}

          	seq_puts(m, saved_command_line);
          	seq_putc(m, 10);
          	return 0;
          }"""

              pattern = r'static int cmdline_proc_show\(struct seq_file \*m, void \*v\)\s*\{.*?\n\}'
              if re.search(pattern, content, re.DOTALL):
                  content = helper_code + "\n" + re.sub(pattern, replacement_func, content, flags=re.DOTALL)
                  with open(cmdline_path, "w") as f:
                      f.write(content)
                  print("Successfully spoofed fs/proc/cmdline.c with ULTRA Compiler Optimizations")
              else:
                  print("Error: Target func not found in cmdline.c via regex")

          # 2. Modify fs/proc/bootconfig.c (ULTRA CACHE & DOUBLE-CHECKED LOCK OPTIMIZED)
          boot_path = "fs/proc/bootconfig.c"
          if os.path.exists(boot_path):
              with open(boot_path, "r") as f:
                  boot_content = f.read()

              boot_helper = r"""
          #include <linux/string.h>
          #include <linux/cred.h>
          #include <linux/mutex.h>
          #include <linux/slab.h>
          #include <linux/compiler.h>

          static void replace_xbc_str(char *buf, size_t max_len, const char *search, const char *replace)
          {
          	char *p = buf;
          	size_t s_len = strlen(search);
          	size_t r_len = strlen(replace);

          	while ((p = strstr(p, search)) != NULL) {
          		size_t cur_len = strlen(buf);
          		size_t tail_len = strlen(p + s_len);
          		if (r_len > s_len && cur_len + (r_len - s_len) >= max_len)
          			break;
          		if (r_len != s_len)
          			memmove(p + r_len, p + s_len, tail_len + 1);
          		memcpy(p, replace, r_len);
          		p += r_len;
          	}
          }
          """

              boot_replacement = r"""
          static char *spoofed_boot_config = NULL;
          static DEFINE_MUTEX(spoofed_bootconfig_mutex);

          static int boot_config_proc_show(struct seq_file *m, void *v)
          {
          	if (saved_boot_config) {
          		if (likely(__kuid_val(current_uid()) >= 10000)) {
          			if (unlikely(!spoofed_boot_config)) {
          				mutex_lock(&spoofed_bootconfig_mutex);
          				if (!spoofed_boot_config) {
          					size_t len = strlen(saved_boot_config);
          					spoofed_boot_config = kzalloc(len + 256, GFP_KERNEL);
          					if (spoofed_boot_config) {
          						memcpy(spoofed_boot_config, saved_boot_config, len + 1);
          						replace_xbc_str(spoofed_boot_config, len + 256, "androidboot.verifiedbootstate = \"orange\"", "androidboot.verifiedbootstate = \"green\"");
          						replace_xbc_str(spoofed_boot_config, len + 256, "androidboot.verifiedbootstate = \"yellow\"", "androidboot.verifiedbootstate = \"green\"");
          						replace_xbc_str(spoofed_boot_config, len + 256, "androidboot.verifiedbootstate = \"red\"", "androidboot.verifiedbootstate = \"green\"");
          						replace_xbc_str(spoofed_boot_config, len + 256, "androidboot.vbmeta.device_state = \"unlocked\"", "androidboot.vbmeta.device_state = \"locked\"");
          						replace_xbc_str(spoofed_boot_config, len + 256, "androidboot.flash.locked = \"0\"", "androidboot.flash.locked = \"1\"");
          						replace_xbc_str(spoofed_boot_config, len + 256, "androidboot.selinux = \"permissive\"", "androidboot.selinux = \"enforcing\"");
          						replace_xbc_str(spoofed_boot_config, len + 256, "androidboot.buildvariant = \"userdebug\"", "androidboot.buildvariant = \"user\"");
          						replace_xbc_str(spoofed_boot_config, len + 256, "androidboot.buildvariant = \"eng\"", "androidboot.buildvariant = \"user\"");
          						replace_xbc_str(spoofed_boot_config, len + 256, "buildvariant = \"userdebug\"", "buildvariant = \"user\"");
          						replace_xbc_str(spoofed_boot_config, len + 256, "buildvariant = \"eng\"", "buildvariant = \"user\"");
          						replace_xbc_str(spoofed_boot_config, len + 256, "androidboot.mode = \"custom\"", "androidboot.mode = \"normal\"");
          						replace_xbc_str(spoofed_boot_config, len + 256, "androidboot.mode = \"recovery\"", "androidboot.mode = \"normal\"");
          						replace_xbc_str(spoofed_boot_config, len + 256, "androidboot.secureboot = \"0\"", "androidboot.secureboot = \"1\"");
          						replace_xbc_str(spoofed_boot_config, len + 256, "androidboot.lockstate = \"unlocked\"", "androidboot.lockstate = \"locked\"");
          						replace_xbc_str(spoofed_boot_config, len + 256, "androidboot.warranty_bit = \"1\"", "androidboot.warranty_bit = \"0\"");
          						replace_xbc_str(spoofed_boot_config, len + 256, "androidboot.warranty_bits = \"1\"", "androidboot.warranty_bits = \"0\"");
          						replace_xbc_str(spoofed_boot_config, len + 256, "androidboot.force_normal_boot = \"0\"", "androidboot.force_normal_boot = \"1\"");
          					}
          				}
          				mutex_unlock(&spoofed_bootconfig_mutex);
          			}
          			
          			if (likely(spoofed_boot_config)) {
          			    seq_puts(m, spoofed_boot_config);
          			    return 0;
          			}
          		}
          		seq_puts(m, saved_boot_config);
          	}
          	return 0;
          }"""

              boot_pattern = r'static int boot_config_proc_show\(struct seq_file \*m, void \*v\)\s*\{.*?\n\}'
              if re.search(boot_pattern, boot_content, re.DOTALL):
                  boot_content = boot_helper + "\n" + re.sub(boot_pattern, boot_replacement, boot_content, flags=re.DOTALL)
                  with open(boot_path, "w") as f:
                      f.write(boot_content)
                  print("Successfully spoofed fs/proc/bootconfig.c with ULTRA Compiler Optimizations")
              else:
                  print("Error: Target func not found in bootconfig.c via regex")

          # 3. Modify fs/proc/array.c
          array_path = "fs/proc/array.c"
          if os.path.exists(array_path):
              with open(array_path, "r") as f:
                  array_content = f.read()
              
              array_content = array_content.replace('#include <linux/fs_struct.h>', '#include <linux/fs_struct.h>\n#include <linux/cred.h>')
              
              tstate_target = 'seq_puts(m, "State:\\t");\n\tseq_puts(m, get_task_state(p));'
              tstate_repl = 'seq_puts(m, "State:\\t");\n\tif (__kuid_val(current_uid()) >= 10000 && (*get_task_state(p) == \'t\' || *get_task_state(p) == \'T\'))\n\t\tseq_puts(m, "S (sleeping)");\n\telse\n\t\tseq_puts(m, get_task_state(p));'
              array_content = array_content.replace(tstate_target, tstate_repl)

              stat_target = 'state = *get_task_state(task);'
              stat_repl = 'state = *get_task_state(task);\n\tif (__kuid_val(current_uid()) >= 10000 && (state == \'t\' || state == \'T\')) {\n\t\tstate = \'S\';\n\t\twchan = 0;\n\t}'
              array_content = array_content.replace(stat_target, stat_repl)

              with open(array_path, "w") as f:
                  f.write(array_content)
              print("Successfully spoofed fs/proc/array.c")

          # 4. Modify security/selinux/ss/services.c (BATTERY OPTIMIZED REWRITE)
          services_path = "security/selinux/ss/services.c"
          if os.path.exists(services_path):
              with open(services_path, "r") as f:
                  serv_content = f.read()

              engine_marker = '#include "policycap_names.h"'
              engine_code = (
                  '#include "policycap_names.h"\n\n'
                  '/* --- INJECTED: OPTIMIZED RCU SPOOFING ENGINE --- */\n'
                  '#include <linux/uidgid.h>\n'
                  '#include <linux/cred.h>\n'
                  '#include <linux/compiler.h>\n'
                  '#include <linux/mutex.h>\n'
                  '#include <linux/rcupdate.h>\n\n'
                  'struct selinux_spoof_ids {\n'
                  '\tu16 cap_c, process_c, binder_c;\n'
                  '\tu32 fsck_t, shell_t, su_t, adbd_t, adbroot_t;\n'
                  '\tstruct rcu_head rcu;\n'
                  '};\n\n'
                  'static struct selinux_spoof_ids __rcu *global_spoof;\n'
                  'static DEFINE_MUTEX(spoof_update_mutex);\n\n'
                  'static void update_spoof_ids(struct selinux_policy *policy)\n'
                  '{\n'
                  '\tstruct selinux_spoof_ids *new_ids;\n'
                  '\tstruct selinux_spoof_ids *old_ids;\n'
                  '\tstruct policydb *policydb = &policy->policydb;\n'
                  '\tu32 i;\n\n'
                  '\tnew_ids = kzalloc(sizeof(*new_ids), GFP_ATOMIC);\n'
                  '\tif (!new_ids) return;\n\n'
                  '\tfor (i = 1; i <= policydb->p_classes.nprim; i++) {\n'
                  '\t\tconst char *n = sym_name(policydb, SYM_CLASSES, i - 1);\n'
                  '\t\tif (!n) continue;\n'
                  '\t\tif (!strcmp(n, "capability")) new_ids->cap_c = i;\n'
                  '\t\telse if (!strcmp(n, "process")) new_ids->process_c = i;\n'
                  '\t\telse if (!strcmp(n, "binder")) new_ids->binder_c = i;\n'
                  '\t}\n\n'
                  '\tfor (i = 1; i <= policydb->p_types.nprim; i++) {\n'
                  '\t\tconst char *n = sym_name(policydb, SYM_TYPES, i - 1);\n'
                  '\t\tif (!n) continue;\n'
                  '\t\tif (!strcmp(n, "fsck_untrusted")) new_ids->fsck_t = i;\n'
                  '\t\telse if (!strcmp(n, "shell")) new_ids->shell_t = i;\n'
                  '\t\telse if (!strcmp(n, "su")) new_ids->su_t = i;\n'
                  '\t\telse if (!strcmp(n, "adbd")) new_ids->adbd_t = i;\n'
                  '\t\telse if (!strcmp(n, "adbroot")) new_ids->adbroot_t = i;\n'
                  '\t}\n\n'
                  '\tmutex_lock(&spoof_update_mutex);\n'
                  '\told_ids = rcu_dereference_protected(global_spoof, lockdep_is_held(&spoof_update_mutex));\n'
                  '\trcu_assign_pointer(global_spoof, new_ids);\n'
                  '\tmutex_unlock(&spoof_update_mutex);\n\n'
                  '\tif (old_ids)\n'
                  '\t\tkfree_rcu(old_ids, rcu);\n'
                  '}\n'
                  '/* ----------------------------------------------- */'
              )

              if engine_marker in serv_content:
                  serv_content = serv_content.replace(engine_marker, engine_code, 1)

              # HIGH-SPEED REWRITE: Int-Check before Context-Check before UID-Check.
              av_hook = (
                  '\tcontext_struct_compute_av(policydb, scontext, tcontext, tclass, avd,\n'
                  '\t\t\t\t  NULL);\n\n'
                  '\t/* --- OPTIMIZED AVC BYPASS --- */\n'
                  '\tif (unlikely(avd->allowed) && scontext && tcontext) {\n'
                  '\t\tstruct selinux_spoof_ids *s_ids;\n'
                  '\t\trcu_read_lock(); /* Stop battery-draining LockDep logs! */\n'
                  '\t\ts_ids = rcu_dereference(global_spoof);\n'
                  '\t\tif (likely(s_ids)) {\n'
                  '\t\t\t/* STEP 1: Eliminate 99.9% of routine operations via raw integers */\n'
                  '\t\t\tif (unlikely(tclass == s_ids->cap_c || tclass == s_ids->process_c || tclass == s_ids->binder_c)) {\n'
                  '\t\t\t\t/* STEP 2: Only access heavy current_uid() if classes actually match */\n'
                  '\t\t\t\tif (unlikely(__kuid_val(current_uid()) >= 10000)) {\n'
                  '\t\t\t\t\tbool spoof = false;\n'
                  '\t\t\t\t\tif (s_ids->fsck_t && tclass == s_ids->cap_c && scontext->type == s_ids->fsck_t && tcontext->type == s_ids->fsck_t)\n'
                  '\t\t\t\t\t\tspoof = true;\n'
                  '\t\t\t\t\telse if (s_ids->su_t && tclass == s_ids->process_c && scontext->type == s_ids->shell_t && tcontext->type == s_ids->su_t)\n'
                  '\t\t\t\t\t\tspoof = true;\n'
                  '\t\t\t\t\telse if (s_ids->adbroot_t && tclass == s_ids->binder_c && scontext->type == s_ids->adbd_t && tcontext->type == s_ids->adbroot_t)\n'
                  '\t\t\t\t\t\tspoof = true;\n\n'
                  '\t\t\t\t\tif (spoof) {\n'
                  '\t\t\t\t\t\tavd->allowed = 0;\n'
                  '\t\t\t\t\t\tavd->auditdeny = 0;\n'
                  '\t\t\t\t\t\tavd->auditallow = 0;\n'
                  '\t\t\t\t\t}\n'
                  '\t\t\t\t}\n'
                  '\t\t\t}\n'
                  '\t\t}\n'
                  '\t\trcu_read_unlock();\n'
                  '\t}\n'
                  '\t/* ----------------------------- */'
              )

