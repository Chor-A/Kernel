name: build-kernel

on:
  schedule:
    - cron: "0 22 * * *" # Daily 3:30 AM IST (22:00 UTC)
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the build as a GitHub release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (auto-generated as kernel-YYYYMMDD when empty)'
        required: false
        default: ""
      kernel_repo:
        description: 'Kernel source repository (full URL)'
        required: false
        default: "https://github.com/Steambot12/Templar-Kernel-GKI-5.10"
      kernel_branch:
        description: 'Kernel source branch'
        required: false
        default: "Linux3-Staging"
      kernel_commit:
        description: 'Kernel source commit'
        required: false
        default: ""
      clang_version:
        description: Clang toolchain version
        required: false
        type: choice
        options:
          - clang 19
          - clang 14
          - neutron clang 24
        default: "neutron clang 24"
      defconfig_fragment_exclude:
        description: 'Defconfig fragments to exclude'
        required: false
        default: ""
      append_build_env:
        description: 'Extra KEY=VALUE pairs appended to build.config'
        required: false
        default: ""
      append_config:
        description: 'Extra literal CONFIG_* lines injected into the defconfig'
        required: false
        default: "CONFIG_KALLSYMS=y,CONFIG_KALLSYMS_ALL=y,CONFIG_KSU=y,CONFIG_KSU_TOOLKIT_SUPPORT=y,CONFIG_KSU_INLINE_HOOK=y,CONFIG_KSU_DISABLE_SELINUX_VFS_GETXATTR=y,CONFIG_KSU_DEBUG=n,CONFIG_KSU_SUCOMPAT=n,CONFIG_OVERLAY_FS=y,CONFIG_KPROBES=y,CONFIG_HAVE_KPROBES=y,CONFIG_KPROBE_EVENTS=y,CONFIG_NOMOUNT=y,CONFIG_LRU_GEN=y,CONFIG_LRU_GEN_ENABLED=y,CONFIG_SCHED_BORE=n"
      ccache:
        description: 'Accelerate with ccache.'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-build-${{ github.event.inputs.release_tag || 'default' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      KERNEL_COMMIT: ${{ inputs.kernel_commit }}
      CLANG_ASSET: ${{ fromJSON('{"clang 14":"clang-r450784e-linux-x86.tar.zst","clang 19":"clang-r536225-linux-x86.tar.zst","neutron clang 24":"neutron-clang-24"}')[inputs.clang_version] }}
      DEFCONFIG_FRAGMENT_EXCLUDE: ${{ inputs.defconfig_fragment_exclude }}
      APPEND_BUILD_ENV: ${{ inputs.append_build_env }}
      APPEND_CONFIG: ${{ inputs.append_config }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CCACHE_OPT: ${{ inputs.ccache && '1' || '' }}
      GITHUB_TOKEN: ${{ github.token }}
      KMI_SYMBOL_LIST_STRICT_MODE: "0"
      UPDATE_SYMBOL_LIST: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          if [ -f "build/free-disk-space.sh" ]; then
            sudo bash build/free-disk-space.sh
          fi
          df -h

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdw-dev ccache gh bc bison flex libssl-dev libelf-dev dwarves cpio curl zstd lz4
          pip install lxml

      - name: Configure Git Safe Directory & Identity
        run: |
          git config --global --add safe.directory "*"
          git config --global user.email "Antonio_Nelson@proton.me"
          git config --global user.name "Chor-A"

      - name: Restore ccache cache
        if: ${{ inputs.ccache }}
        uses: actions/cache@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}-${{ github.run_id }}
          restore-keys: |
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}-
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-
          fail-on-cache-miss: false

      - name: Add 15G swap (Fix for Full LTO OOM)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 15G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=15360
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h


      - name: Clone Kernel Source
        run: |
          mkdir -p work
          git clone -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} work/common
          cd work/common

          if [ -n "${{ env.KERNEL_COMMIT }}" ]; then
            git checkout ${{ env.KERNEL_COMMIT }}
          fi


      - name: Apply Real LZ4, Swappiness 40 & Force 'none' Scheduler
        run: |
          cd work/common

          echo "=== 1. Real Swappiness Change ==="
          sed -i 's/vm.swappiness=5/vm.swappiness=40 elevator=none/g' arch/arm64/configs/gki_defconfig

          echo "=== 2. Hardcode Real LZ4 Compressor in Kernel ==="
          echo 'CONFIG_ZRAM_DEF_COMP="lz4"' >> arch/arm64/configs/gki_defconfig
          
          echo "=== 3. Lock ZRAM & I/O Scheduler (C89 Compliant) ==="
          python3 - << 'EOF'
          import os, re

          # A) Lock ZRAM to LZ4 (Using your zram_drv.txt structure)
          zram_path = "drivers/block/zram/zram_drv.c"
          if os.path.exists(zram_path):
              with open(zram_path, "r") as f: content = f.read()
              
              # Capture exactly up to "size_t sz;" and inject safely after it
              pattern = r"(static ssize_t comp_algorithm_store[\s\S]*?size_t sz;)"
              if re.search(pattern, content):
                  content = re.sub(pattern, r"\1\n\n\t/* BLOCK ROM ZRAM OVERWRITE */\n\treturn len;", content)
                  with open(zram_path, "w") as f: f.write(content)
                  print("✅ ZRAM LZ4 strictly locked.")

          # B) Lock I/O Scheduler to 'none' globally (Using your elevator.txt structure)
          elv_path = "block/elevator.c"
          if os.path.exists(elv_path):
              with open(elv_path, "r") as f: content = f.read()
              
              # 1. Block kernel from setting a default during boot (Capture up to "int err;")
              pattern1 = r"(void elevator_init_mq\(struct request_queue \*q\)[\s\S]*?int err;)"
              if re.search(pattern1, content):
                  content = re.sub(pattern1, r"\1\n\n\t/* FORCE 'NONE' SCHEDULER GLOBALLY */\n\treturn;", content)
                  
              # 2. Block user-space/ROM from overriding it later (Capture up to "int ret;")
              pattern2 = r"(ssize_t elv_iosched_store[\s\S]*?int ret;)"
              if re.search(pattern2, content):
                  content = re.sub(pattern2, r"\1\n\n\t/* BLOCK ROM SCHEDULER OVERWRITE */\n\treturn count;", content)
                  
              with open(elv_path, "w") as f: f.write(content)
              print("✅ I/O Scheduler globally and strictly locked to 'none'.")
          EOF
          
          
      - name: Purge le9uo commits (MGLRU Preparation)
        run: |
          cd work/common
          echo "=== 1. Dynamically Finding and Reverting all le9uo commits ==="
          
          LE9UO_COMMITS=$(git log --grep="le9uo" -i --format="%H")
          
          if [ -n "$LE9UO_COMMITS" ]; then
            echo "Found le9uo commits:"
            echo "$LE9UO_COMMITS"
            
            for commit in $LE9UO_COMMITS; do
              echo "-> Reverting: $commit"
              if ! git revert --no-commit "$commit"; then
                echo "⚠️ Conflict detected on $commit, checking conflicted files..."
                for conf in arch/arm64/configs/gki_defconfig arch/arm64/configs/*defconfig; do
                  if [ -f "$conf" ]; then
                    git checkout HEAD -- "$conf" 2>/dev/null || true
                    git add "$conf" 2>/dev/null || true
                  fi
                done

                if git diff --name-only --diff-filter=U | grep -q .; then
                  echo "⚠️ Unresolvable code conflict on $commit! Aborting this specific revert..."
                  git revert --abort
                else
                  echo "✅ Defconfig conflict auto-resolved for $commit"
                fi
              fi
            done
            
            git commit -m "chore: Purge le9uo commits for MGLRU" || true
            echo "✅ le9uo commits successfully reverted!"
          else
            echo "✅ No le9uo commits found!"
          fi

          echo "=== 2. Hard Purge Leftover Kconfig Strings (Failsafe) ==="
          sed -i '/config CLEAN_LOW_RATIO/,/knob./d' mm/Kconfig 2>/dev/null || true
          sed -i '/clean_low_ratio/d' mm/Kconfig 2>/dev/null || true
          echo "✅ Hard purge complete!"

      - name: Clean Hardcoded NoMount & Integrate Official NoMount (Method 3 - Dev Branch)
        run: |
          cd work/common

          echo "=== 1. Completely Purging All Old NoMount ==="
          rm -rf fs/nomount fs/nomount.c fs/nomount.h
          sed -i '/nomount/d' fs/Kconfig
          sed -i '/nomount/d' fs/Makefile

          sed -i '/nomount/d' fs/d_path.c 2>/dev/null || true
          sed -i '/nomount/d' fs/namei.c 2>/dev/null || true
          sed -i '/nomount/d' fs/stat.c 2>/dev/null || true
          sed -i '/nomount/d' fs/statfs.c 2>/dev/null || true
          sed -i '/nomount/d' fs/readdir.c 2>/dev/null || true
          sed -i '/nomount/d' fs/proc/task_mmu.c 2>/dev/null || true

          echo "=== 2. Integrating Official NoMount via Method 3 (dev branch) ==="
          git clone --depth=1 -b dev https://github.com/maxsteeel/nomount.git ../nomount

          sed -i '$i source "fs/nomount/Kconfig"' fs/Kconfig
          echo 'obj-$(CONFIG_NOMOUNT) += nomount/' >> fs/Makefile

          mkdir -p fs/nomount
          if [ -d "../nomount/kernel/src" ]; then
            cp -rf ../nomount/kernel/src/* fs/nomount/
          elif [ -d "../nomount/src" ]; then
            cp -rf ../nomount/src/* fs/nomount/
          fi

          echo "CONFIG_NOMOUNT=y" >> arch/arm64/configs/gki_defconfig
          echo "✅ Old NoMount wiped and Official Method 3 (dev branch) applied!"

      - name: Apply SUSFS, Custom Patches & Direct Code Spoofing
        run: |
          cd work/common

          echo "=== 1. Integrating SUSFS into Kernel ==="
          git clone --depth=1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          cp -r ../susfs4ksu/kernel_patches/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch || echo "Warning: SUSFS patch issue"
          
          sed -i '1i #include <linux/cred.h>' include/linux/susfs_def.h
          echo "✅ Fixed current_uid() missing header in susfs_def.h"

          sed -i '1i #include <linux/cred.h>' fs/statfs.c
          sed -i '2i #include <linux/susfs.h>' fs/statfs.c
          
          sed -i '/#include "internal.h"/a #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\nextern int susfs_sus_kstat_spoof_vfs_statfs(struct inode *inode, struct kstatfs *buf, bool *is_fuse);\n#endif' fs/statfs.c
          echo "✅ Fixed SuSFS compilation headers and patch structural bugs!"

          echo "int __attribute__((weak)) ksu_install_su_fd(struct file *file) { return 0; }" >> fs/susfs.c

          echo "=== 2. Applying Custom Patches (services, etc.) ==="
          for dir in "$GITHUB_WORKSPACE/.github/workflows/patches" "$GITHUB_WORKSPACE/patches"; do
            if [ -d "$dir" ]; then
              for patch_file in "$dir"/*.patch; do
                if [ -f "$patch_file" ]; then
                  echo "Applying $patch_file..."
                  sed -i 's/\r$//' "$patch_file"
                  
                  if git apply --verbose --ignore-whitespace --whitespace=nowarn "$patch_file"; then
                    echo "✅ Applied via git apply"
                  elif patch -p1 -N -F 3 --no-backup-if-mismatch < "$patch_file"; then
                    echo "✅ Applied via patch"
                  else
                    echo "::error:: Failed to apply patch $patch_file ! Aborting build."
                    exit 1
                  fi

                fi
              done
            fi
          done
          echo "✅ All .patch files applied successfully!"

          echo "=== 3. Directly Injecting Spoof Modifications via Python (C89 Compliant) ==="
          python3 - << 'EOF'
          import os
          import re

          def replace_c_func_overkill(content, func_regex, new_func_code):
              match = re.search(func_regex, content)
              if not match:
                  return content, False
              
              start_idx = match.start()
              brace_start = content.find('{', start_idx)
              if brace_start == -1: return content, False
                  
              NORMAL, IN_STRING, IN_CHAR, IN_LINE_COMMENT, IN_BLOCK_COMMENT = 0, 1, 2, 3, 4
              state = NORMAL; brace_count = 0; end_idx = -1; i = brace_start; length = len(content)
              
              while i < length:
                  c = content[i]
                  if state == NORMAL:
                      if c == '/' and i + 1 < length:
                          nc = content[i+1]
                          if nc == '/': state = IN_LINE_COMMENT; i += 1
                          elif nc == '*': state = IN_BLOCK_COMMENT; i += 1
                      elif c == '"': state = IN_STRING
                      elif c == "'": state = IN_CHAR
                      elif c == '{': brace_count += 1
                      elif c == '}':
                          brace_count -= 1
                          if brace_count == 0:
                              end_idx = i + 1
                              break
                  elif state == IN_STRING:
                      if c == '\\': i += 1
                      elif c == '"': state = NORMAL
                  elif state == IN_CHAR:
                      if c == '\\': i += 1
                      elif c == "'": state = NORMAL
                  elif state == IN_LINE_COMMENT:
                      if c == '\n': state = NORMAL
                  elif state == IN_BLOCK_COMMENT:
                      if c == '*' and i + 1 < length and content[i+1] == '/': state = NORMAL; i += 1
                  i += 1
              if end_idx != -1: return content[:start_idx] + new_func_code + content[end_idx:], True
              return content, False

          cmdline_path = "fs/proc/cmdline.c"
          if os.path.exists(cmdline_path):
              with open(cmdline_path, "r") as f: content = f.read()
              helper_code = r"""
          #include <linux/slab.h>
          #include <linux/string.h>
          #include <linux/cred.h>
          #include <linux/spinlock.h>
          #include <linux/compiler.h>

          static void replace_str(char *buf, size_t max_len, const char *search, const char *replace)
          {
          	char *p = buf;
          	size_t s_len = strlen(search), r_len = strlen(replace);
          	while ((p = strstr(p, search)) != NULL) {
          		size_t cur_len = strlen(buf), tail_len = strlen(p + s_len);
          		if (r_len > s_len && cur_len + (r_len - s_len) >= max_len) break;
          		if (r_len != s_len) memmove(p + r_len, p + s_len, tail_len + 1);
          		memcpy(p, replace, r_len); p += r_len;
          	}
          }
          """
              replacement_func = r"""static int cmdline_proc_show(struct seq_file *m, void *v)
          {
          	static char *spoofed_cmdline = NULL;
          	static DEFINE_SPINLOCK(spoofed_cmdline_lock);
          	char *cmd_cache = READ_ONCE(spoofed_cmdline);

          	if (!saved_command_line) {
          		seq_putc(m, '\n'); return 0;
          	}

          	if (likely(__kuid_val(current_uid()) >= 10000)) {
          		if (unlikely(!cmd_cache)) {
          			size_t len = strlen(saved_command_line);
          			char *tmp = kzalloc(len + 256, GFP_KERNEL);
          			if (tmp) {
          				memcpy(tmp, saved_command_line, len + 1);
          				replace_str(tmp, len + 256, "androidboot.verifiedbootstate=orange", "androidboot.verifiedbootstate=green");
          				replace_str(tmp, len + 256, "androidboot.verifiedbootstate=yellow", "androidboot.verifiedbootstate=green");
          				replace_str(tmp, len + 256, "androidboot.vbmeta.device_state=unlocked", "androidboot.vbmeta.device_state=locked");
          				replace_str(tmp, len + 256, "androidboot.flash.locked=0", "androidboot.flash.locked=1");
          				replace_str(tmp, len + 256, "androidboot.selinux=permissive", "androidboot.selinux=enforcing");
          				replace_str(tmp, len + 256, "androidboot.warranty_bit=1", "androidboot.warranty_bit=0");
          				
          				spin_lock(&spoofed_cmdline_lock);
          				if (!spoofed_cmdline) {
          					smp_store_release(&spoofed_cmdline, tmp);
          					cmd_cache = tmp; tmp = NULL; 
          				} else { cmd_cache = spoofed_cmdline; }
          				spin_unlock(&spoofed_cmdline_lock);
          				if (tmp) kfree(tmp);
          			}
          		}
          		if (likely(cmd_cache)) {
          			seq_puts(m, cmd_cache);
          			seq_putc(m, '\n');
          			return 0;
          		}
          	}
          	seq_puts(m, saved_command_line); seq_putc(m, '\n'); return 0;
          }"""
              pattern = r'static int cmdline_proc_show\(struct seq_file \*m, void \*v\)\s*'
              if "replace_str" not in content: content = helper_code + "\n" + content
              new_content, success = replace_c_func_overkill(content, pattern, replacement_func)
              if success:
                  with open(cmdline_path, "w") as f: f.write(new_content)
                  print("✅ cmdline.c -> SPOOFED")

          boot_path = "fs/proc/bootconfig.c"
          if os.path.exists(boot_path):
              with open(boot_path, "r") as f: boot_content = f.read()
              boot_helper = r"""
          #include <linux/string.h>
          #include <linux/cred.h>
          #include <linux/spinlock.h>
          #include <linux/slab.h>
          #include <linux/compiler.h>

          #define repl(B, L, S, R) do{ char *p=B; while((p=strstr(p,S))!=NULL) { size_t s_l=strlen(S), r_l=strlen(R), tail=strlen(p+s_l); memmove(p+r_l, p+s_l, tail+1); memcpy(p, R, r_l); p+=r_l; } }while(0)
          """
              boot_replacement = r"""static int boot_config_proc_show(struct seq_file *m, void *v)
          {
          	static char *spoofed_boot_config = NULL;
          	static DEFINE_SPINLOCK(spoofed_bootconfig_lock);
          	char *b_cache = READ_ONCE(spoofed_boot_config);

          	if (saved_boot_config) {
          		if (likely(__kuid_val(current_uid()) >= 10000)) {
          			if (unlikely(!b_cache)) {
          				size_t len = strlen(saved_boot_config);
          				char *tmp = kzalloc(len + 256, GFP_KERNEL);
          				if (tmp) {
          					memcpy(tmp, saved_boot_config, len + 1);
          					repl(tmp, len+256, "androidboot.verifiedbootstate = \"orange\"", "androidboot.verifiedbootstate = \"green\"");
          					repl(tmp, len+256, "androidboot.vbmeta.device_state = \"unlocked\"", "androidboot.vbmeta.device_state = \"locked\"");
          					repl(tmp, len+256, "androidboot.flash.locked = \"0\"", "androidboot.flash.locked = \"1\"");
          					spin_lock(&spoofed_bootconfig_lock);
          					if (!spoofed_boot_config) {
          						smp_store_release(&spoofed_boot_config, tmp);
          						b_cache = tmp; tmp = NULL; 
          					} else { b_cache = spoofed_boot_config; }
          					spin_unlock(&spoofed_bootconfig_lock);
          					if (tmp) kfree(tmp);
          				}
          			}
          			if (likely(b_cache)) {
          			    seq_puts(m, b_cache); return 0;
          			}
          		}
          		seq_puts(m, saved_boot_config);
          	}
          	return 0;
          }"""
              boot_pattern = r'static int boot_config_proc_show\(struct seq_file \*m, void \*v\)\s*'
              if "repl(B, L, S, R)" not in boot_content: boot_content = boot_helper + "\n" + boot_content
              new_boot_content, success = replace_c_func_overkill(boot_content, boot_pattern, boot_replacement)
              if success:
                  with open(boot_path, "w") as f: f.write(new_boot_content)
                  print("✅ bootconfig.c -> SPOOFED")

          array_path = "fs/proc/array.c"
          if os.path.exists(array_path):
              with open(array_path, "r") as f: array_content = f.read()
              if '#include <linux/cred.h>' not in array_content:
                  array_content = array_content.replace('#include <linux/fs_struct.h>', '#include <linux/fs_struct.h>\n#include <linux/cred.h>')
              
              tstate_target = 'seq_puts(m, "State:\\t");\n\tseq_puts(m, get_task_state(p));'
              tstate_repl = 'seq_puts(m, "State:\\t");\n\tif (__kuid_val(current_uid()) >= 10000 && (*get_task_state(p) == \'t\' || *get_task_state(p) == \'T\'))\n\t\tseq_puts(m, "S (sleeping)");\n\telse\n\t\tseq_puts(m, get_task_state(p));'
              
              if tstate_target in array_content:
                  array_content = array_content.replace(tstate_target, tstate_repl)
                  with open(array_path, "w") as f: f.write(array_content)
                  print("✅ array.c -> SPOOFED (C89 Compliant)")

          services_path = "security/selinux/ss/services.c"
          if os.path.exists(services_path):
              with open(services_path, "r") as f: serv_content = f.read()

              target_av_call_regex = r'(context_struct_compute_av\(policydb,\s*scontext,\s*tcontext,\s*tclass,\s*avd,\s*NULL\);)'
              
              av_hook_injection = r"""\1

          	/* --- SAFED AVC BYPASS --- */
          	if (unlikely(avd->allowed) && scontext && tcontext) {
          		if (unlikely(__kuid_val(current_uid()) >= 10000)) {
          			struct selinux_spoof_ids *s_ids;
          			rcu_read_lock();
          			s_ids = rcu_dereference(global_spoof);
          			if (likely(s_ids)) {
          				bool spoof = false;
          				if (s_ids->cap_c && tclass == s_ids->cap_c) {
          					if (s_ids->fsck_t && scontext->type == s_ids->fsck_t && tcontext->type == s_ids->fsck_t) spoof = true;
          				} else if (s_ids->process_c && tclass == s_ids->process_c) {
          					if (s_ids->shell_t && s_ids->su_t && scontext->type == s_ids->shell_t && tcontext->type == s_ids->su_t) spoof = true;
          				} else if (s_ids->binder_c && tclass == s_ids->binder_c) {
          					if (s_ids->adbd_t && s_ids->adbroot_t && scontext->type == s_ids->adbd_t && tcontext->type == s_ids->adbroot_t) spoof = true;
          				}
          				if (unlikely(spoof)) {
          					avd->allowed = 0;
          					avd->auditdeny = 0;
          					avd->auditallow = 0;
          				}
          			}
          			rcu_read_unlock();
          		}
          	}
          	/* ------------------------------------- */"""

              if "SAFED AVC BYPASS" not in serv_content:
                  serv_content = re.sub(target_av_call_regex, av_hook_injection, serv_content, count=1)
                  
                  engine_marker = '#include "policycap_names.h"'
                  engine_code = (
                      '#include "policycap_names.h"\n\n'
                      '/* --- INJECTED: SECURE SELINUX ID SPOOF --- */\n'
                      '#include <linux/uidgid.h>\n#include <linux/cred.h>\n'
                      '#include <linux/rcupdate.h>\n#include <linux/spinlock.h>\n\n'
                      'struct selinux_spoof_ids { u16 cap_c, process_c, binder_c; u32 fsck_t, shell_t, su_t, adbd_t, adbroot_t; struct rcu_head rcu; };\n'
                      'static struct selinux_spoof_ids __rcu *global_spoof;\n'
                      'static DEFINE_SPINLOCK(spoof_update_lock);\n\n'
                      'static void update_spoof_ids(struct selinux_policy *policy) {\n'
                      '\tstruct selinux_spoof_ids *new_ids, *old_ids; u32 i;\n'
                      '\tnew_ids = kzalloc(sizeof(*new_ids), GFP_KERNEL); if (!new_ids) return;\n'
                      '\tfor (i=1; i<=policy->policydb.p_classes.nprim; i++) {\n'
                      '\t\tconst char *n = sym_name(&policy->policydb, SYM_CLASSES, i - 1); if(!n) continue;\n'
                      '\t\tif(!strcmp(n, "capability")) new_ids->cap_c=i;\n\t\telse if(!strcmp(n, "process")) new_ids->process_c=i;\n\t\telse if(!strcmp(n, "binder")) new_ids->binder_c=i;\n\t}\n'
                      '\tfor (i=1; i<=policy->policydb.p_types.nprim; i++) {\n'
                      '\t\tconst char *n = sym_name(&policy->policydb, SYM_TYPES, i - 1); if(!n) continue;\n'
                      '\t\tif(!strcmp(n, "fsck_untrusted")) new_ids->fsck_t=i;\n\t\telse if(!strcmp(n, "shell")) new_ids->shell_t=i;\n\t\telse if(!strcmp(n, "su")) new_ids->su_t=i;\n'
                      '\t\telse if(!strcmp(n, "adbd")) new_ids->adbd_t=i;\n\t\telse if(!strcmp(n, "adbroot")) new_ids->adbroot_t=i;\n\t}\n'
                      '\tspin_lock(&spoof_update_lock);\n'
                      '\told_ids = rcu_dereference_protected(global_spoof, lockdep_is_held(&spoof_update_lock));\n'
                      '\trcu_assign_pointer(global_spoof, new_ids);\n'
                      '\tspin_unlock(&spoof_update_lock);\n'
                      '\tif (old_ids) kfree_rcu(old_ids, rcu);\n}\n'
                  )
                  serv_content = serv_content.replace(engine_marker, engine_code, 1)

                  commit_marker = 'security_load_policycaps(state, newpolicy);'
                  commit_code = 'security_load_policycaps(state, newpolicy);\n\tupdate_spoof_ids(newpolicy);'
                  serv_content = serv_content.replace(commit_marker, commit_code, 1)

                  with open(services_path, "w") as f: f.write(serv_content)
                  print("✅ services.c -> SPOOFED")
          EOF
          echo "✅ PYTHON ENGINE SCRIPT EXECUTION SUCCESSFULLY COMPLETE."

